DESCS.utilityOps='Import meter reads, review exceptions, bill, apply payments, and manage delinquency';
VIEWS.utilityOps=async()=>{const w=!!B.perms.write;const tab=S.tab&&(w||!['billing','payments'].includes(S.tab))?S.tab:(w?'billing':'bills');S.tab=tab;const top=tabsHTML([['readings','Meter readings'],...(w?[['billing','Billing cycle'],['payments','Payments']]:[]),['delinquency','Delinquency & shut-off'],['bills','Bills & bill print']],tab);const p=S.param;
  if(tab==='readings'){const ex=await api('meterReadings',{exceptions:1});const all=await api('meterReadings',{});const unb=ex.filter(r=>!r.billId);
    return top+`<div class="toolbar">${B.perms.write?btn('Import readings (Itron Temetra / CSV)',readingsDlg):''}<span class="muted small right">${unb.length} unbilled exception${unb.length===1?'':'s'}</span></div>
    ${unb.length?`<div class="notice warn">Exceptions (negative, zero or unusually high consumption) are held out of billing unless you include them. High and zero reads bill by default; negative reads must be corrected with a new reading.</div>`:''}
    <div class="panels even">${panel('Exceptions to review',T([['readDate','Read date','date'],[r=>labelFor('utilityAccounts',r.accountId),'Account'],[r=>labelFor('meters',r.meterId),'Meter'],['reading','Reading','num'],['consumption','Usage (kgal)','num'],['exception','Exception'],[r=>r.billId?'Billed':'Unbilled','Status','badge']],ex.slice(0,100),{empty:'No exceptions.'}))}${panel('Latest readings',T([['readDate','Read date','date'],[r=>labelFor('utilityAccounts',r.accountId),'Account'],['reading','Reading','num'],['consumption','Usage','num'],['source','Source']],all.slice(0,60)))}</div>`}
  if(tab==='billing'){const per=p.period||B.today.slice(0,7);const pv=await api('billingPreview',{period:per});
    return top+`<div class="toolbar"><label class="small muted">Billing month <input class="field" type="month" value="${esc(per)}" onchange="S.param.period=this.value;render()"></label>${B.perms.write?btn('Run billing for '+per,()=>formDialog('Run utility billing – '+per,[fld('billDate','Bill date',{type:'date',req:1,def:'today'}),fld('dueDate','Due date',{type:'date',req:1,def:addDays(B.today,21)}),fld('includeExceptions','Bill negative/unreviewed exceptions too?',{type:'select',opts:['No','Yes'],def:'No'})],'Create bills & post',async v=>{const r=await api('runBilling',Object.assign({period:per},v));closeModal();toast(r.message,'ok');render()},{intro:`<p class="small muted">Creates one bill per account (water, sewer, stormwater, refuse, plus previous balance), posts Dr Utility Receivable / Cr service revenue by fund, and marks readings billed.</p>`}),'ok'):''}</div>
    ${statCards([['Accounts to bill',num(pv.accounts),pv.alreadyBilled?pv.alreadyBilled+' already billed':''],['Total to bill',money(pv.total)],['Exceptions held',num(pv.exceptions),'Review in Meter readings'],['Accounts without a reading',num(pv.noReading),'Billed base charges only']])}
    ${panel('Charges by service',T([['s','Service'],['v','Amount','money']],Object.entries(pv.byService).map(([s,v])=>({s:human(s),v}))))}`}
  if(tab==='payments')return top+panel('Apply payments in bulk',`<p class="small muted">Import lockbox, bank or online-payment files to apply many utility payments at once. Each row posts a cash receipt (Dr Cash / Cr Utility Receivable) and reduces the account balance. Payments for one day are grouped into a single deposit for bank reconciliation.</p>${B.perms.write?btn('Import payment file',()=>csvDialog('Import utility payments','Columns: <b>accountNo</b>, <b>date</b>, <b>amount</b>, optional <b>reference</b>.','accountNo,date,amount,reference\nUT-00001,2026-10-05,63.40,LBX-1001',async(rows,v)=>{const r=await api('importUtilityPayments',Object.assign({rows,source:'Lockbox'},v));closeModal();toast(r.message,'ok');if(r.errors&&r.errors.length)showModal(`<h2 id="mTitle">Rows skipped</h2><ul>${r.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><div class="actions"><button class="btn" onclick="closeModal()">OK</button></div>`)},{fields:[fld('method','Payment method',{type:'select',opts:['Check','ACH','Card','Cash'],def:'Check'})]})):''}<p class="small muted" style="margin-top:12px">Single payments are recorded from the account itself (open the account → Record payment). Citizens can also pay online in the portal.</p>`);
  if(tab==='delinquency'){const sl=await api('shutoffList');
    return top+`<div class="toolbar">${B.perms.finance?btn('Assess late fees',()=>formDialog('Assess late fees',[fld('asOf','As of',{type:'date',req:1,def:'today'})],'Run',async v=>{const r=await api('delinquencyRun',v);closeModal();toast(r.message,'ok');render()},{intro:'<p class="small muted">Applies the late fee from Settings → Utility billing to bills past due and not yet charged, and marks accounts Delinquent.</p>'})):''}</div>
    ${panel('Shut-off candidates ('+sl.rows.length+')',`<form id="so">${T([[r=>r.order?'':`<input type="checkbox" value="${esc(r.accountId)}" data-a="${r.pastDue}" aria-label="Select ${esc(r.accountNo)}">`,'','html'],['accountNo','Account'],['customer','Customer'],['address','Service address'],['pastDue','Past due','money'],['order','Disconnect order']],sl.rows,{empty:'No accounts meet the shut-off criteria.'})}${B.perms.approve&&sl.rows.length?`<div class="actions"><button class="btn dangerSolid" type="submit">Create disconnect orders</button></div>`:''}</form>`)}`}
  const per=p.period||'';const bills=await api('utilityBills',{period:per});
  return top+`<div class="toolbar"><label class="small muted">Month <input class="field" type="month" value="${esc(per)}" onchange="S.param.period=this.value;render()"></label>${per&&B.perms.write?btn('Bill print file',async()=>{try{fileResult(await api('billPrintFile',{period:per}))}catch(e){fail(e)}},'secondary'):'<span class="muted small">Choose a month to create the bill print / mail-house file.</span>'}${btn('Billing analytics',()=>openReport('utilityAnalytics'),'secondary')}</div>`+panel('Bills',T([['number','Bill'],['accountNo','Account'],['period','Period'],['consumption','kgal','num'],['water','Water','money'],['sewer','Sewer','money'],['storm','Storm','money'],['refuse','Refuse','money'],['lateFee','Late fee','money'],['amount','Current','money'],['paid','Paid','money'],['dueDate','Due','date'],['status','Status','badge']],bills.slice(0,500)));
};

DESCS.taxOps='Real estate, personal property and business license billing, penalties and interest, and assessments';
VIEWS.taxOps=async()=>{const tab=S.tab||'billing';S.tab=tab;const top=tabsHTML([['billing','Billing'],['delinquency','Penalty & interest'],['assessments','Assessments'],['collections','Collections']],tab);const p=S.param;
  if(tab==='billing'){const type=p.type||'Real Estate',yr=p.taxYear||B.today.slice(0,4),inst=p.installment||'1';const pv=await api('taxBillingPreview',{type,taxYear:yr,installment:inst});

    ${pv.bills?btn('Create '+pv.bills+' bills',()=>formDialog('Run '+type+' billing',[fld('dueDate','Due date',{type:'date',req:1,def:addDays(B.today,45)})],'Create bills & post',async v=>{const r=await api('taxBillingRun',{type,taxYear:yr,installment:inst,dueDate:v.dueDate});closeModal();toast(r.message,'ok');render()},{intro:`<p class="small muted">Posts Dr Taxes Receivable / Cr ${esc(type)} tax revenue for the net levy.${type==='Personal Property'&&+B.settings.pptraReliefPct>0?' PPTRA car tax relief is recorded as due from the Commonwealth.':''}</p>`}),'ok'):''}</div>
    ${statCards([['New bills',num(pv.bills),pv.alreadyBilled?pv.alreadyBilled+' already billed':''],['Gross levy',money(pv.levy)],[type==='Personal Property'?'PPTRA relief':'Tax relief',money(pv.relief)],['Net billed',money(pv.net)]])}
    <div class="notice">Rates are in Settings → Taxes (real estate per $100, personal property per $100, PPTRA %, BPOL gross-receipts rates by category).</div>`}
  if(tab==='delinquency')return top+panel('Penalty and interest',`<p class="small muted">Assesses the late-payment penalty (percentage with a minimum, never more than the tax) once per bill after the due date, and monthly interest on unpaid tax. Bills become Delinquent. Liens can be recorded from each tax bill.</p>${B.perms.finance?btn('Assess penalty & interest',()=>formDialog('Assess penalty & interest',[fld('asOf','As of',{type:'date',req:1,def:'today'})],'Run',async v=>{const r=await api('taxDelinquencyRun',v);closeModal();toast(r.message,'ok')})):''}`);

/* ---------- Map (ESRI basemap via Leaflet) ---------- */
DESCS.map='Assets, work, permits, code cases, citizen requests and delinquent accounts on an ESRI basemap';

function loadLeaflet(){return new Promise((res,rej)=>{if(window.L&&window.L.map)return res(window.L);const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=()=>window.L&&window.L.map?res(window.L):rej(new Error('Map library unavailable'));s.onerror=()=>rej(new Error('Map library unavailable'));document.head.appendChild(s);setTimeout(()=>rej(new Error('timeout')),8000)})}
VIEWS.map=async()=>{const d=await api('mapData');S.data=d;const layers=[...new Set(d.points.map(x=>x.layer))];
  return `<div class="legend" style="margin:8px 0 12px">${layers.map(l=>`<span><i style="background:${LAYER_COLORS[l]||'#333'}"></i>${esc(l)} (${d.points.filter(x=>x.layer===l).length})</span>`).join('')}</div><section class="panel flush"><div id="mapbox" style="height:560px"><div class="empty">Loading map…</div></div></section>
  <section class="panel flush" style="margin-top:16px"><div class="phead"><h3>All mapped items</h3></div>${T([['layer','Layer'],['title','Item'],['sub','Detail'],['status','Status','badge']],d.points,{click:x=>navigate(x.view,{open:x.id})})}</section>`};
AFTER.map=async()=>{const d=S.data;let Lf;try{Lf=await loadLeaflet()}catch(e){const b=$('#mapbox');if(b)b.innerHTML='<div class="empty">The basemap could not be loaded (no internet access to the map service). The items are listed below.</div>';return}
  const box=$('#mapbox');if(!box)return;box.innerHTML='';const m=Lf.map(box);
  Lf.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(m);
  const groups={};d.points.forEach(x=>{const g=groups[x.layer]||(groups[x.layer]=Lf.layerGroup().addTo(m));const mk=Lf.circleMarker([x.lat,x.lng],{radius:7,color:'#fff',weight:2,fillColor:LAYER_COLORS[x.layer]||'#333',fillOpacity:.9}).addTo(g);
    mk.bindPopup(`<b>${esc(x.title)}</b><br>${esc(x.sub)}<br>${badge(x.status)}<br><button class="btn sm" style="margin-top:6px" onclick="${h(()=>navigate(x.view,{open:x.id}))}">Open record</button>`)});
  Lf.control.layers(null,groups,{collapsed:false}).addTo(m);
  if(d.points.length)m.fitBounds(d.points.map(x=>[x.lat,x.lng]),{padding:[30,30]});else m.setView(String(B.settings.mapCenter||'37.2279,-77.4019').split(',').map(Number),13)};
</script>

<script>
'use strict';
/* =====================================================================
   IntelliERP module screens, part 3: search, KPIs, assistant, data
   import, report builder, integrations, settings, my account,
   employee self-service and the public citizen portal.
   ===================================================================== */

/* ---------- Global search ---------- */
DESCS.search='Every record you have access to';
VIEWS.search=async()=>{const q=S.param.q||'';const box=`<form class="toolbar" onsubmit="event.preventDefault();navigate('search',{q:this.q.value})"><input class="field search" name="q" type="search" value="${esc(q)}" placeholder="Name, number, address, description…" style="min-width:360px">${'<button class="btn" type="submit">Search</button>'}</form>`;
  if(!q.trim())return box+'<div class="empty">Type at least two characters.</div>';const rows=await api('search',{q});
  return box+panel(rows.length+' result'+(rows.length===1?'':'s')+' for “'+q+'”',T([['label','Record'],['sub','Type · status']],rows,{click:r=>navigate(r.entity,{open:r.id}),empty:'Nothing matched.'}))};

/* ---------- KPI scorecard ---------- */
DESCS.kpis='Performance measures with targets (targets are editable in Settings)';
const kpiVal=k=>k.unit==='$'?moneyK(k.value):k.unit==='%'?num(k.value).toFixed(1)+'%':num(k.value).toLocaleString('en-US',{maximumFractionDigits:1})+' '+esc(k.unit||'');
VIEWS.kpis=async()=>{const k=await api('kpis');const areas=[...new Set(k.map(x=>x.area))];const on=k.filter(x=>x.status==='On target').length,off=k.filter(x=>x.status==='Off target').length;
  return statCards([['Measures',String(k.length)],['On target',String(on),Math.round(on/Math.max(1,k.length)*100)+'%'],['Off target',String(off),'',off?'neg':''],['Areas',String(areas.length)]])+
  areas.map(a=>`<div style="margin-top:16px">${panel(a,T([['name','Measure'],[x=>kpiVal(x),'Value','html'],[x=>(x.dir==='min'?'≤ ':'≥ ')+(x.unit==='$'?moneyK(x.target):x.target+(x.unit==='%'?'%':' '+(x.unit||''))),'Target'],['status','Status','badge'],['note','Note']],k.filter(x=>x.area===a)))}</div>`).join('')};

/* ---------- AI assistant ---------- */
DESCS.assistant='Ask questions about your organization in plain English';
const CHAT=[];
VIEWS.assistant=async()=>{const sug=['How much budget does Public Works have left?','Which invoices are past due?','How many utility accounts are delinquent?','What is our cash position by fund?','Which KPIs are off target?'];
  return `<div class="notice">Answers use live figures from IntelliERP (budget, cash, receivables, KPIs and matching records) and are limited to what your role can see. Check important numbers in the reports before acting.</div>
  <section class="panel"><div id="chat">${CHAT.map(m=>`<div class="msg ${m.who}"><div>${m.html}</div></div>`).join('')||`<div class="muted small">Try: ${sug.map(s=>`<button class="btn ghost sm" style="margin:3px" onclick="${h(()=>askAI(s))}">${esc(s)}</button>`).join('')}</div>`}</div>
  <form id="aiq" style="display:flex;gap:8px;margin-top:14px" onsubmit="event.preventDefault();askAI(this.q.value)"><input class="field" name="q" style="flex:1" placeholder="Ask a question…" autocomplete="off"><button class="btn" type="submit">Ask</button></form></section>`};
async function askAI(q){q=String(q||'').trim();if(!q)return;CHAT.push({who:'me',html:esc(q)});render();try{const r=await api('aiAsk',{question:q});CHAT.push({who:'ai',html:esc(r.answer).replace(/\n/g,'<br>')+((r.hits||[]).length?`<div class="small muted" style="margin-top:8px">Related records: ${r.hits.slice(0,8).map(x=>`<a href="#" onclick="${h(()=>navigate(x.entity,{open:x.id}))};return false">${esc(x.label)}</a>`).join(' · ')}</div>`:'')})}catch(e){CHAT.push({who:'ai',html:`<span class="neg">${esc(e.message)}</span>`})}render()}
AFTER.assistant=()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;const i=$('#aiq input');if(i)i.focus()};

/* ---------- Data import ---------- */
DESCS.imports='Load records from spreadsheets: conversion from the legacy system, or recurring files from other systems';
VIEWS.imports=async()=>{const p=S.param;const ents=Object.entries(B.entities).filter(([k,e])=>e.create!==false&&B.perms[e.write]&&k!=='users').sort((a,b)=>a[1].plural.localeCompare(b[1].plural));
  const special=[['journal','Journal entries (opening balances / history)','finance'],['bank','Bank statement','finance'],['readings','Meter readings','write'],['utilpay','Utility payments','write'],['time','Time (TimeClock Plus)','write'],['assess','Assessment roll','finance']].filter(x=>B.perms[x[2]]);
  const ent=p.entity||'';
  return `<div class="panels"><section class="panel"><h3>Import records</h3><p class="small muted">Choose what to import, then upload a CSV (from Excel: File → Save As → CSV). Column names are matched to fields automatically; references such as vendor, employee or account can be given by name or number. You will see a preview with any errors before anything is saved.</p>
  <div class="toolbar"><select class="field" id="ient" style="min-width:280px"><option value="">Choose a record type…</option>${ents.map(([k,e])=>`<option value="${k}" ${k===ent?'selected':''}>${esc(e.plural)}</option>`).join('')}</select>${btn('Continue',()=>{const k=$('#ient').value;if(k)importWizard(k)})}</div>
  ${ent?'':'<p class="small muted">Tip: open any list and choose <b>Import CSV</b> to start here with that record type selected.</p>'}
  <h3 style="margin-top:20px">Download a template</h3><div class="toolbar"><select class="field" id="itpl"><option value="">Record type…</option>${ents.map(([k,e])=>`<option value="${k}">${esc(e.plural)}</option>`).join('')}</select>${btn('Download CSV template',()=>{const k=$('#itpl').value;if(!k)return;const e=B.entities[k];download(k+'-template.csv',toCSV([e.fields.filter(f=>!f.ro).map(f=>f.label)]),'text/csv')},'secondary')}</div></section>
  <section class="panel"><h3>Financial &amp; operational files</h3><div class="queue">${special.map(x=>`<a href="#" onclick="${h(()=>SPECIAL_IMPORT[x[0]]())};return false"><span>${esc(x[1])}</span><b>→</b></a>`).join('')}</div>
  <p class="small muted" style="margin-top:12px">Every import is recorded in the audit trail. The same imports are available to other systems through the REST API (Integrations).</p></section></div>`};
AFTER.imports=()=>{if(S.param.entity&&!S.param.started){S.param.started=1;importWizard(S.param.entity)}};
const SPECIAL_IMPORT={journal:journalImportDlg,bank:()=>bankImportDlg(),readings:()=>readingsDlg(),utilpay:()=>{navigate('utilityOps');S.tab='payments'},time:()=>importTimeDlg(),assess:()=>assessDlg()};
function importWizard(ent){const e=B.entities[ent];
  csvDialog('Import '+e.plural,`Fields: ${e.fields.filter(f=>!f.ro).map(f=>`<b>${esc(f.label)}</b>${f.req?'*':''}`).join(', ')}. * required.`,e.fields.filter(f=>!f.ro).slice(0,5).map(f=>f.k).join(','),async rows=>{
    const pv=await api('importPreview',{entity:ent,rows});
    showModal(`<h2 id="mTitle">Preview: ${esc(e.plural)}</h2>${statCards([['Rows',String(rows.length)],['Ready to import',String(pv.valid)],['With errors',String(pv.errorCount),'',pv.errorCount?'neg':''],['Columns not used',String(pv.unmapped.length)]])}
     <p class="small"><b>Column mapping:</b> ${Object.entries(pv.mapped).map(([h2,k])=>`${esc(h2)} → ${esc((e.fields.find(f=>f.k===k)||{}).label||k)}`).join(' · ')||'none'}${pv.unmapped.length?`<br><span class="muted">Ignored: ${pv.unmapped.map(esc).join(', ')}</span>`:''}</p>
     ${pv.errors.length?`<div class="notice bad" style="max-height:140px;overflow:auto">${pv.errors.map(esc).join('<br>')}</div>`:''}
     ${pv.sample.length?`<h3 style="font-size:14px">First rows</h3>${autoTable(pv.sample.map(r=>{const o={};e.list.forEach(k=>o[k]=r[k]);return o}))}`:''}
     <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>${pv.valid?`<button class="btn" onclick="${h(async()=>{try{const r=await api('importCommit',{entity:ent,rows,skipInvalid:pv.errorCount>0});closeModal();toast(r.message,'ok');navigate(ent)}catch(err){fail(err)}})}">Import ${pv.valid} ${pv.errorCount?'valid ':''}rows</button>`:''}</div>`,'wide')},{label:'Preview'})}
function journalImportDlg(){csvDialog('Import journal entries','Columns: <b>reference</b> (rows with the same reference form one entry), <b>date</b>, <b>memo</b>, <b>account</b>, <b>fund</b>, optional <b>department</b>, <b>project</b>, and <b>debit</b>/<b>credit</b>. Each entry must balance within each fund. <b>Conversion</b> mode (administrators) loads history into closed periods for the 7-year history requirement and is excluded from budget actuals only if dated in prior years.',
  'reference,date,memo,account,fund,department,debit,credit\nOB-1,2026-07-01,Opening balance,1000,100,,1500000,\nOB-1,2026-07-01,Opening balance,3000,100,,,1500000',async(rows,v)=>{const r=await api('importJournal',{rows,mode:v.mode});closeModal();toast(r.message,'ok');if(r.errors&&r.errors.length)showModal(`<h2 id="mTitle">Entries not posted</h2><div class="notice bad">${r.errors.map(esc).join('<br>')}</div><div class="actions"><button class="btn" onclick="closeModal()">OK</button></div>`,'wide')},{fields:[fld('mode','Mode',{type:'select',opts:B.perms.admin?['normal','conversion']:['normal'],def:'normal'})]})}

/* ---------- Report builder (ad hoc) ---------- */
DESCS.reportBuilder='Build, save and share your own reports from any data set';
const RB={ds:null,data:null,cfg:{cols:[],filters:[],group:'',sum:[],sort:'',dir:1}};
VIEWS.reportBuilder=async()=>{const sets=await api('datasets');const saved=await api('savedReports');S.data=sets;
  if(RB.ds&&!RB.data){RB.data=await api('dataset',{key:RB.ds})}
  const ds=sets.find(x=>x.key===RB.ds);
  let out=`<div class="panels"><section class="panel"><h3>1. Data set</h3><select class="field" style="width:100%" onchange="${h(()=>{})}" id="rbds"><option value="">Choose…</option>${sets.map(x=>`<option value="${x.key}" ${x.key===RB.ds?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
  if(ds){const F2=ds.fields;const c=RB.cfg;
    out+=`<h3 style="margin-top:16px">2. Columns</h3><div style="max-height:180px;overflow:auto;columns:2;font-size:13px">${F2.map(f=>`<label style="display:block"><input type="checkbox" data-col="${f.k}" ${c.cols.includes(f.k)?'checked':''}> ${esc(f.label)}</label>`).join('')}</div>
    <h3 style="margin-top:16px">3. Filters</h3><div id="rbf">${c.filters.map((x,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px"><select class="field" data-fi="${i}" data-p="k">${F2.map(f=>`<option value="${f.k}" ${f.k===x.k?'selected':''}>${esc(f.label)}</option>`).join('')}</select><select class="field" style="min-width:90px" data-fi="${i}" data-p="op">${['=','≠','contains','>','<','≥','≤','is blank','not blank'].map(o=>`<option ${o===x.op?'selected':''}>${o}</option>`).join('')}</select><input class="field" data-fi="${i}" data-p="v" value="${esc(x.v)}"><button class="iconbtn" data-del="${i}" aria-label="Remove filter">✕</button></div>`).join('')}</div><button class="btn ghost sm" id="rbadd">+ Add filter</button>
    <h3 style="margin-top:16px">4. Summarize (optional)</h3><div class="fg"><label>Group by<select id="rbg"><option value="">No grouping (list)</option>${F2.map(f=>`<option value="${f.k}" ${f.k===c.group?'selected':''}>${esc(f.label)}</option>`).join('')}</select></label><label>Totals of<select id="rbs" multiple size="4">${F2.filter(f=>f.type==='number').map(f=>`<option value="${f.k}" ${c.sum.includes(f.k)?'selected':''}>${esc(f.label)}</option>`).join('')}</select></label></div>
    <div class="actions">${btn('Run report',()=>{rbRead();render()})}${btn('Save…',()=>{rbRead();formDialog('Save report',[fld('name','Report name',{req:1}),fld('shared','Share with everyone in the organization?',{type:'select',opts:['No','Yes'],def:'No'})],'Save',async v=>{const r=await api('saveReport',{name:v.name,shared:v.shared,dataset:RB.ds,config:RB.cfg});closeModal();toast(r.message,'ok');render()})},'secondary')}</div>`}
  out+=`</section><section class="panel"><h3>Saved reports</h3>${T([['name','Report'],[r=>(sets.find(x=>x.key===r.dataset)||{}).label||r.dataset,'Data set'],['owner','Owner'],['shared','Shared']],saved,{click:r=>{RB.ds=r.dataset;RB.data=null;try{RB.cfg=Object.assign({cols:[],filters:[],group:'',sum:[]},JSON.parse(r.config||'{}'))}catch(e){}render()},empty:'No saved reports yet.'})}</section></div>`;
  if(ds&&RB.data){const res=rbRun(ds);S.rbcsv=res.csv;out+=`<section class="panel flush" style="margin-top:16px"><div class="phead"><h3>${esc(ds.label)} · ${res.count} rows</h3><span style="display:flex;gap:8px">${btn('Export CSV',()=>openExport('report.csv',toCSV(S.rbcsv)),'secondary sm')}${btn('Print',()=>window.print(),'secondary sm')}</span></div>${res.html}</section>`}
  return out};
AFTER.reportBuilder=()=>{const s=$('#rbds');if(s)s.onchange=()=>{RB.ds=s.value;RB.data=null;RB.cfg={cols:[],filters:[],group:'',sum:[]};const ds=(S.data||[]).find(x=>x.key===RB.ds);if(ds)RB.cfg.cols=ds.fields.slice(0,8).map(f=>f.k);render()};
  const add=$('#rbadd');if(add)add.onclick=()=>{rbRead();const ds=S.data.find(x=>x.key===RB.ds);RB.cfg.filters.push({k:ds.fields[0].k,op:'=',v:''});render()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rbRead();RB.cfg.filters.splice(+b.dataset.del,1);render()})};
function rbRead(){const c=RB.cfg;c.cols=[...document.querySelectorAll('[data-col]:checked')].map(i=>i.dataset.col);const fs=[];document.querySelectorAll('[data-fi]').forEach(el=>{const i=+el.dataset.fi;fs[i]=fs[i]||{};fs[i][el.dataset.p]=el.value});c.filters=fs.filter(Boolean);const g=$('#rbg');if(g)c.group=g.value;const sm=$('#rbs');if(sm)c.sum=[...sm.selectedOptions].map(o=>o.value)}
function rbRun(ds){const c=RB.cfg,F2=ds.fields,fo=k=>F2.find(f=>f.k===k)||{k,label:k};const disp=(f,v)=>f.ref||f.src?labelFor(f.ref||f.src,v):v;
  const test=(r,x)=>{const f=fo(x.k),raw=r[x.k],v=String(disp(f,raw)??'').toLowerCase(),q=String(x.v||'').toLowerCase(),n=num(raw),qn=num(x.v);switch(x.op){case '=':return f.type==='number'?n===qn:v===q;case '≠':return f.type==='number'?n!==qn:v!==q;case 'contains':return v.includes(q);case '>':return f.type==='number'?n>qn:v>q;case '<':return f.type==='number'?n<qn:v<q;case '≥':return f.type==='number'?n>=qn:v>=q;case '≤':return f.type==='number'?n<=qn:v<=q;case 'is blank':return raw===''||raw==null;case 'not blank':return !(raw===''||raw==null)}return true};
  let rows=RB.data.filter(r=>c.filters.every(x=>test(r,x)));
  if(c.group){const g={};rows.forEach(r=>{const k=String(disp(fo(c.group),r[c.group])??'');const o=g[k]||(g[k]={_k:k,_n:0});o._n++;c.sum.forEach(s=>o[s]=(o[s]||0)+num(r[s]))});const list=Object.values(g).sort((a,b)=>a._k.localeCompare(b._k,undefined,{numeric:true}));
    const cols=[['_k',fo(c.group).label],['_n','Count','num'],...c.sum.map(s=>[s,fo(s).label,MONEYKEY.test(s)?'money':'num'])];
    return {count:list.length,csv:[cols.map(x=>x[1]),...list.map(r=>cols.map(x=>r[x[0]]))],html:T(cols,list,{foot:`<td>Total</td><td class="num">${rows.length}</td>${c.sum.map(s=>`<td class="num">${num(list.reduce((t,r)=>t+r[s],0)).toLocaleString('en-US',{maximumFractionDigits:2})}</td>`).join('')}`})}}
  const cols=(c.cols.length?c.cols:F2.slice(0,8).map(f=>f.k)).map(k=>{const f=fo(k);return [r=>disp(f,r[k]),f.label,f.type==='number'?'num':k==='status'?'badge':'text']});
  return {count:rows.length,csv:[cols.map(x=>x[1]),...rows.map(r=>cols.map(x=>x[0](r)))],html:T(cols,rows.slice(0,2000),{empty:'No rows match.'})}}

/* ---------- Integrations & API ---------- */
DESCS.integrations='REST API keys, webhooks and connections to other systems';
VIEWS.integrations=async()=>{const tab=S.tab||'api';S.tab=tab;const top=tabsHTML([['api','REST API keys'],['webhooks','Webhooks'],['docs','API reference'],['connections','Connections']],tab);
  if(tab==='api'){const keys=await api('apiKeys');return top+`<div class="toolbar">${btn('+ New API key',()=>formDialog('New API key',[fld('name','Name (which system uses it)',{req:1}),fld('role','Access level',{type:'select',opts:['Viewer','Clerk','Finance'],def:'Viewer',hint:'Viewer = read only. Clerk = create records and imports. Finance = also post journal entries.'})],'Create key',async v=>{const r=await api('apiKeyCreate',v);showModal(`<h2 id="mTitle">Copy your API key</h2><div class="notice warn">${esc(r.message)}</div><textarea class="exportbox" style="height:60px" readonly>${esc(r.key)}</textarea><div class="actions"><button class="btn" onclick="closeModal();render()">Done</button></div>`)}))}</div>`+panel('API keys',T([['name','Name'],['prefix','Key'],['role','Role'],['status','Status','badge'],['createdBy','Created by'],['lastUsed','Last used']],keys,{click:k=>k.status==='Active'&&ask('Revoke '+k.name+'? Systems using it will stop working.',{ok:'Revoke',danger:true}).then(y=>y&&api('apiKeyRevoke',{id:k.id}).then(r=>{toast(r.message,'ok');render()}).catch(fail)),empty:'No API keys yet.'}))}
  if(tab==='webhooks'){const log=await api('webhookLog');return top+`<div class="notice">IntelliERP posts a JSON event (for example <code>invoices.pay</code>, <code>payRuns.processed</code>, <code>permits.issue</code>) to your URL whenever a workflow action happens, signed with HMAC-SHA256 in the <code>X-IntelliERP-Signature</code> header. Set the URL, secret and events in Settings → Integrations.</div><div class="toolbar">${btn('Send test event',async()=>{try{const r=await api('webhookTest');toast(r.message,'ok');render()}catch(e){fail(e)}})}${btn('Webhook settings',()=>{navigate('settings');S.tab='Integrations';render()},'secondary')}</div>`+panel('Recent deliveries',T([['at','When'],['event','Event'],['status','Status'],['detail','Detail']],log,{empty:'No deliveries yet.'}))}
  if(tab==='docs')return top+panel('REST API',`<p class="small">Send <code>POST</code> requests with a JSON body to the web app URL. Every call is authenticated with an API key, limited to 120 requests per minute, and recorded in the audit trail.</p>
<pre class="exportbox" style="height:auto;white-space:pre-wrap">POST ${esc((B.portalUrl||'').split('?')[0])}
Content-Type: application/json

{ "key": "ierp_${esc(B.tenant.t)}_…", "method": "list", "params": { "entity": "vendors" } }</pre>
${T([['m','Method'],['p','Params'],['d','Does']],[['list','entity','All records of a type'],['get','entity, id | key','One record'],['create / update','entity, record','Create or change a record (same validation as the screens)'],['action','entity, id, action, payload','Run a workflow step (approve, pay, issue…)'],['report','name, params','Any report (trialBalance, budgetVsActual, grantStatus…)'],['journal / dataset','filters | key','General ledger and report-builder data sets'],['import','entity, rows, skipInvalid','Bulk create records'],['importReadings','rows, source','Meter reads (Itron Temetra / AMI)'],['importPayments','rows, method','Utility payments (lockbox, online)'],['importTime','rows, periodStart, periodEnd','Hours from TimeClock Plus'],['importBankStatement','rows','Bank statement lines'],['importAssessments','rows','Assessment roll'],['postJournal','date, memo, lines','Journal entry (Finance keys only)']].map(x=>({m:x[0],p:x[1],d:x[2]})))}`);
  return top+`<div class="panels even">${panel('Microsoft Entra ID (SSO)',`<p class="small muted">Staff sign in with their Microsoft 365 accounts; Conditional Access and MFA are enforced by Microsoft. Configure in Settings → Security &amp; sign-in.</p>${badge(B.settings.ssoEnabled==='Yes'?'Active':'Not configured')}`)}
  ${panel('Online payments (Stripe)',`<p class="small muted">Citizens pay utility and tax bills in the portal. The convenience fee is paid by the customer. Payments post automatically as cash receipts.</p>${badge(B.settings.paymentProvider==='Stripe'?'Active':'Not configured')}`)}
  ${panel('ESRI ArcGIS',`<p class="small muted">Import assets from feature services (Assets → Import from ArcGIS). The map uses ESRI basemaps.</p>${B.perms.finance?btn('Import from ArcGIS',gisDialog,'secondary sm'):''}`)}
  ${panel('Itron Temetra / AMI',`<p class="small muted">Meter reads are imported by file or pushed through the API (importReadings).</p>${btn('Import readings',readingsDlg,'secondary sm')}`)}
  ${panel('TimeClock Plus',`<p class="small muted">Hours are imported by CSV export or the TimeClock Plus API through importTime.</p>${btn('Import time',importTimeDlg,'secondary sm')}`)}
  ${panel('NEOGOV',`<p class="small muted">Applicants can be imported (Applicants → Import CSV) or received through the API; the public job board is built in.</p>`)}
  ${panel('AI assistant (Anthropic Claude)',`<p class="small muted">Plain-English questions and invoice capture. Configure the API key in Settings → AI assistant.</p>${badge(B.settings.aiApiKey?'Active':'Not configured')}`)}
  ${panel('Banking',`<p class="small muted">NACHA ACH (vendor CCD, payroll PPD), positive pay and BAI/CSV statement import.</p>${btn('Bank & payments',()=>navigate('bank'),'secondary sm')}`)}</div>`};

function drawPortal(){const I=PS.info;const PK={pay:'utilities',tax:'revenue',permit:'operations',report:'operations',jobs:'hr'};const tabs=[['pay','Pay a utility bill'],['tax','Pay taxes'],['permit','Apply for a permit'],['report','Report a problem'],['status','Check status'],['jobs','Jobs']].filter(x=>!I.modules||!PK[x[0]]||I.modules.includes(PK[x[0]]));if(!tabs.some(x=>x[0]===PS.tab))PS.tab=tabs[0][0];const t=PS.tab;

      ${t==='pay'?T([['period','Period'],['consumption','kgal','num'],['amount','Amount','money'],['paid','Paid','money'],['dueDate','Due','date'],['status','Status','badge']],bills):T([['number','Bill'],['type','Tax'],['taxYear','Year'],['description','Property'],[b=>b.balance!==undefined?b.balance:num(b.amount)+num(b.penalty)+num(b.interest)+num(b.fees)-num(b.paid),'Balance','money'],['dueDate','Due','date'],['status','Status','badge']],bills)}
      ${bal>0?(I.payments?`<form id="pp" class="toolbar"><label class="small muted">Amount <input class="field" name="amount" type="number" step="0.01" min="1" value="${r2(bal).toFixed(2)}"></label>${t==='tax'?`<select class="field" name="bill">${bills.filter(b=>num(b.balance!==undefined?b.balance:1)>0).map(b=>`<option value="${esc(b.number)}">${esc(b.number)} ${esc(b.type)}</option>`).join('')}</select>`:''}<button class="btn ok" type="submit">Pay online</button><div class="form-error"></div><span class="small muted">A convenience fee of ${num(I.fee.pct*100).toFixed(2)}% (minimum ${money(I.fee.min)}) is charged by the card processor.</span></form>`:'<div class="notice">Online payment is not available yet. Pay by mail or in person.</div>'):'<div class="notice good">Nothing is due. Thank you!</div>'}</div>`}}

(function(){const st=document.createElement('style');st.textContent=`

const DEMO_ROLES=[['admin','admin@city.gov','City Administrator','dashboard'],['finance','finance@city.gov','Finance Director','invoices'],['hr','hr@city.gov','HR & Payroll','payroll'],['approver','approver@city.gov','Public Works Director','requisitions'],['clerk','clerk@city.gov','Utility & Revenue Clerk','utilityOps'],['employee','employee@city.gov','Employee self-service','self'],['portal','','Resident portal',''],['platform','ops@intellisoft-tech.com','Intellisoft console','billing']];
function demoBase(){const u=String(START.appUrl||'');return (/intellisoft-tech\.com/.test(u)?u.replace(/\/+$/,''):'https://erp.intellisoft-tech.com')+'/demo/'}
async function demoGo(key){const d=DEMO_ROLES.find(x=>x[0]===key);if(!d)return;
  if(!window.__PREVIEW){goTo(demoBase()+'?role='+key);return}             // live service: the demo runs separately, in the visitor's browser
  if(window.__demo){if(key==='portal'){window.__pvOpenPortal();return}window.__demo(d[1],d[3]);return} // standalone demo page
  /* offline preview: same real sign-in flow, filled in automatically */
  if(key==='portal'){window.__pvOpenPortal();return}
  const t=key==='platform'?'platform':(START.t&&START.t!=='platform'?START.t:'petersburg');if(window.__pvEnsureCity&&t!=='platform')window.__pvEnsureCity(t);
  try{const r=await api('login',{t,email:d[1],password:'Demo-Password-2026'});const m=__GAS_STORE.mail.slice().reverse().find(x=>x.to===d[1]);
    const v=await api('verify',{challenge:r.challenge,code:/(\d{6})/.exec(m.subject)[1]});START.t=t;START.name=(__dev.tenants_()[t]||{}).name||'';saveToken(v.token);try{history.replaceState(null,'','?t='+t+'#'+d[3])}catch(e){}await startApp()}catch(e){fail(e)}}
const showLogin0=showLogin;
showLogin=function(...a){showLogin0(...a);const box=document.querySelector('#app .boxmsg.auth');if(!box)return;
  const demoHere=window.__PREVIEW||!START.t;  // live service: only on the organization-code screen, never on a city's own sign-in page
  let html='';
  if(!START.t)html+=`<p class="small muted" style="margin:14px 0 0;text-align:center">Intellisoft staff: use organization code <b>intellisoft</b>.</p>`;
  if(demoHere)html+=`<div class="demobox"><div class="demohead">Try a demo — no sign-up${window.__PREVIEW?' <span class="muted">· password '+esc('Demo-Password-2026')+'</span>':''}</div><div class="demochips">${DEMO_ROLES.map(d=>`<button type="button" class="chip" data-demo="${d[0]}">${esc(d[2])}</button>`).join('')}</div><div class="small muted">${window.__PREVIEW?'Signs in with the sample account for that role, including the one-time code.':'Opens the live demo: a complete sample city running in your browser. Nothing you enter is saved on our servers.'}</div></div>`;
  const foot=box.querySelector('.authfoot');if(foot)foot.insertAdjacentHTML('beforebegin',html);else box.insertAdjacentHTML('beforeend',html);
  box.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent='Opening…';demoGo(b.dataset.demo)})};
(function(){const st=document.createElement('style');st.textContent=`.demobox{margin-top:18px;border-top:1px solid var(--line2);padding-top:14px}.demohead{font-size:13px;font-weight:700;margin-bottom:8px}.demochips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.demochips .chip{border:1px solid #cfdcd9;background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:650;color:#0c5a56;cursor:pointer}.demochips .chip:hover{border-color:#0f7470;background:#e3f1ef}`;document.head.appendChild(st)})();
</script>

<script>
'use strict';
/* ================= Boot ================= */
(function boot(){
  if(START.portal&&START.t)return renderPortal();
  if(START.signup)return showSignup();
  if(START.ssoError)return showLogin(START.ssoError);
  if(START.ssoToken){saveToken(START.ssoToken);try{history.replaceState(null,'',location.pathname+'?t='+encodeURIComponent(START.t))}catch(e){}return startApp()}
  if(START.invite&&START.t)return showSetPassword();
  if(START.asked&&!START.t)return showLogin('That sign-in link is not valid, or the organization is not active. Check the link or contact your administrator.');
  TOKEN=loadToken();if(!TOKEN)return window.__landing?window.__landing():showLogin();
  startApp();
})();
</script>
