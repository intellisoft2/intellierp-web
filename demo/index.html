/** Posts a balanced entry. Every fund must balance on its own (fund accounting). Returns the entry id. */

    project: String(l.project || '').trim(), debit: money2_(l.debit), credit: money2_(l.credit) })).filter(l => l.debit || l.credit);

    if (a.status === 'Inactive') throw new Error(n + 'account ' + l.account + ' is inactive.');
    if (!funds[l.fund]) throw new Error(n + 'fund ' + (l.fund || '(blank)') + ' does not exist.');
    if (l.department && depts.indexOf(l.department) < 0) throw new Error(n + 'department ' + l.department + ' does not exist.');
    if (l.project && !projects[l.project]) throw new Error(n + 'project ' + l.project + ' does not exist.');

    if (l.debit && l.credit) throw new Error(n + 'enter a debit or a credit, not both.');

    debit: l.debit, credit: l.credit, memo: String(o.memo || '').slice(0, 500), source: o.source || 'Manual', sourceRef: o.sourceRef || '',
    postedBy: u.email, postedAt: ts, reversalOf: o.reversalOf || '' })));

}

  if (lines[0].reversalOf) throw new Error(entryId + ' is itself a reversal and cannot be reversed again.');
  if (readAll_('Journal').some(l => l.reversalOf === entryId)) throw new Error(entryId + ' has already been reversed.');

    lines: lines.map(l => ({ account: l.account, fund: l.fund, department: l.department, project: l.project, debit: l.credit, credit: l.debit })) }, u);

/**
 * RUN THIS FROM THE EDITOR after the first deployment (Run ▸ setupPlatform).
 * Creates the Intellisoft platform console with you as its administrator and emails you a link to set your password.
 * Run it again after every code update: it upgrades every organization's database (adds any new columns) and changes no data.
 */
function setupPlatform() {
  ext_();
  const url = appUrl_();
  if (!url) throw new Error('Deploy the web app first (Deploy ▸ New deployment ▸ Web app), then run setupPlatform again.');
  const email = String(Session.getEffectiveUser().getEmail() || '').toLowerCase();
  const m = tenants_();
  if (!m.platform) {
    const ss = SpreadsheetApp.create('IntelliERP – Platform');
    moveToFolder_(ss.getId(), 'IntelliERP Organizations');
    m.platform = { name: 'Intellisoft Platform', dbId: ss.getId(), status: 'Active', createdAt: now_(), createdBy: email };
    saveTenants_(m);
  }
  Object.keys(m).forEach(k => { if (m[k].status !== 'Active') return; useTenant_(k); setupDb_(SpreadsheetApp.openById(m[k].dbId), k === 'platform' ? { email: email, name: 'Platform Administrator' } : null); });
  useTenant_('platform'); setSetting_('orgName', 'Intellisoft Platform');
  const u = readAll_('Users').find(x => String(x.email).toLowerCase() === email);
  if (u && !u.passwordHash) {
    const tok = issueInvite_(u, 72); update_('Users', u); sendLink_(u, tok, 'invite');
    Logger.log('Set your password (also emailed to ' + email + '): ' + url + '?t=platform&invite=' + tok);

/** Provisions a new organization (city): its own database spreadsheet and a first administrator who receives an invitation email. */
function createTenant_(p, u) {
  const slug = String(p.slug || '').trim().toLowerCase(), name = reqText_(p.name, 'Organization name'), email = String(p.adminEmail || '').trim().toLowerCase(), aname = reqText_(p.adminName, 'Administrator name');

  if (['platform', 'admin', 'api', 'www', 'demo', 'demo-platform'].indexOf(slug) >= 0 || SLUG_ALIAS[slug]) throw new Error('That organization code is reserved.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Administrator email is not valid.');
  const back = __tenant ? __tenant.slug : null;
  return withLock_(() => {
    const m = tenants_();
    if (m[slug]) throw new Error('An organization with code "' + slug + '" already exists.');
    const ss = SpreadsheetApp.create('IntelliERP – ' + name);
    moveToFolder_(ss.getId(), 'IntelliERP Organizations');
    m[slug] = { name: name, dbId: ss.getId(), status: 'Active', createdAt: now_(), createdBy: u.email };

    if (p.signup) m[slug].signup = p.signup;
    saveTenants_(m);
    useTenant_(slug); setupDb_(ss, { email: email, name: aname }); setSetting_('orgName', name);
    const admin = readAll_('Users').find(x => x.email === email);
    const tok = issueInvite_(admin, 72); update_('Users', admin); sendLink_(admin, tok, 'invite');
    audit_({ email: u.email, role: 'Platform' }, 'Created', 'Organization', slug, 'Provisioned by Intellisoft; first administrator ' + email);
    if (p.sample) loadSampleQuiet_({ email: u.email, role: 'Admin' }, p.sampleProfile);
    if (back) useTenant_(back);

    return { message: name + ' is ready. An invitation was emailed to ' + email + '.', url: appUrl_() + '?t=' + slug };
  });
}

/** Copies one organization's database into "IntelliERP Backups/<code>" and keeps the newest 30 copies. */
function backupTenant_(slug, dbId) {
  const it = DriveApp.getFoldersByName('IntelliERP Backups'), root = it.hasNext() ? it.next() : DriveApp.createFolder('IntelliERP Backups');
  const sub = root.getFoldersByName(slug), folder = sub.hasNext() ? sub.next() : root.createFolder(slug);
  DriveApp.getFileById(dbId).makeCopy(slug + ' backup ' + Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HHmm'), folder);
  const files = []; const fi = folder.getFiles(); while (fi.hasNext()) files.push(fi.next());
  files.sort((a, b) => b.getDateCreated() - a.getDateCreated()).slice(30).forEach(f => f.setTrashed(true));
}
/** Nightly job: backs up every organization (including suspended ones). */
function backupAllTenants() {
  const m = tenants_(); let n = 0;
  Object.keys(m).forEach(k => { try { backupTenant_(k, m[k].dbId); n++; } catch (e) { Logger.log('Backup failed for ' + k + ': ' + e.message); } });

}
/** Run once from the editor to back up all organizations every night between 1 and 2 a.m. */
function installBackupTrigger() {
  ScriptApp.getProjectTriggers().filter(t => ['backupAllTenants', 'backupDatabase'].indexOf(t.getHandlerFunction()) >= 0).forEach(t => ScriptApp.deleteTrigger(t));
  ScriptApp.newTrigger('backupAllTenants').timeBased().everyDays(1).atHour(1).create();

}

function reqDate_(v, label) {
  v = String(v || '').trim();

  if (readAll_('DepreciationRuns').some(r => r.period === period)) throw new Error('Depreciation has already been run for ' + period + '.');
  const end = period + '-28', byFund = {}, upd = [];
  readAll_('Assets').forEach(a => {
    if (a.capitalized !== 'Yes' || ['Active', 'Maintenance', 'Retired'].indexOf(a.status) < 0 || !(num_(a.usefulLifeYears) > 0) || !a.acquiredOn || a.acquiredOn > end) return;
    const base = money2_(num_(a.cost) - num_(a.salvageValue)), left = money2_(base - num_(a.accumulatedDepreciation)); if (left <= 0) return;
    const m = Math.min(left, money2_(base / (num_(a.usefulLifeYears) * 12))); if (m <= 0) return;
    a.accumulatedDepreciation = money2_(num_(a.accumulatedDepreciation) + m); upd.push(a);
    const k = (a.fund || setting_('capitalAssetFund')) + '|' + a.department; byFund[k] = money2_((byFund[k] || 0) + m);
  });
  if (!upd.length) throw new Error('No capitalized assets need depreciation for ' + period + '.');
  const lines = [], ftot = {};
  Object.keys(byFund).forEach(k => { const s = k.split('|'); lines.push({ account: A.DEPEXP, fund: s[0], department: s[1], debit: byFund[k] }); ftot[s[0]] = money2_((ftot[s[0]] || 0) + byFund[k]); });
  Object.keys(ftot).forEach(f => lines.push({ account: A.ACCDEP, fund: f, credit: ftot[f] }));
  const total = money2_(Object.keys(ftot).reduce((s, f) => s + ftot[f], 0));
  const je = post_({ date: lastDay_(period), memo: 'Depreciation ' + period + ' (' + upd.length + ' assets)', source: 'Depreciation', sourceRef: period, lines: lines }, u);
  updateMany_('Assets', upd);
  insert_('DepreciationRuns', { id: uuid_(), period: period, assets: upd.length, total: total, entryId: je, runBy: u.email, runAt: now_() });
  return { message: 'Depreciation for ' + period + ': ' + money_(total) + ' on ' + upd.length + ' assets, posted in ' + je + '.' };
}
function lastDay_(period) { const y = +period.slice(0, 4), m = +period.slice(5, 7); return addDays_(period + '-01', new Date(Date.UTC(y, m, 0)).getUTCDate() - 1); }

/* ---------------- Year-end close ---------------- */
function fyBounds_(fy) {
  const y = +String(fy).slice(2), start = parseInt(setting_('fyStartMonth'), 10) || 7;
  const sy = start === 1 ? y : y - 1, s = sy + '-' + String(start).padStart(2, '0') + '-01', e = addDays_((start === 1 ? y + 1 : y) + '-' + String(start).padStart(2, '0') + '-01', -1);
  return { start: s, end: e };
}
function yearEndPreview_(p) {
  const fy = String(p.fiscalYear || ''); if (!/^FY\d{4}$/.test(fy)) throw new Error('Choose a fiscal year.');
  const b = fyBounds_(fy), next = 'FY' + (+fy.slice(2) + 1);
  const pos = readAll_('PurchaseOrders').filter(x => x.status === 'Open' && x.fiscalYear === fy).map(x => ({ number: x.number, vendor: refName_('vendors', x.vendorId), department: x.department, account: x.account, remaining: money2_(num_(x.amount) - num_(x.liquidated)) }));
  const rows = tbRows_({ fy: fy, noClose: true }), funds = {};
  readAll_('Journal').forEach(l => { if (fiscalYear_(l.date) !== fy || l.source === 'Year-end close') return; funds[l.fund] = 1; });
  const rev = money2_(rows.filter(r => r.type === 'Revenue').reduce((s, r) => s + r.credit - r.debit, 0)), exp = money2_(rows.filter(r => r.type === 'Expense').reduce((s, r) => s + r.debit - r.credit, 0));
  return { fiscalYear: fy, nextYear: next, start: b.start, end: b.end, openPOs: pos, rollForward: money2_(pos.reduce((s, x) => s + x.remaining, 0)), revenues: rev, expenses: exp, net: money2_(rev - exp),
    closed: !!setting_('fyClosed.' + fy), funds: Object.keys(funds).sort() };
}
function yearEndClose_(p, u) {
  const pv = yearEndPreview_(p), fy = pv.fiscalYear;
  if (pv.closed) throw new Error(fy + ' has already been closed.');
  let rolled = 0;
  if (p.rollForward !== 'No') {
    readAll_('PurchaseOrders').filter(x => x.status === 'Open' && x.fiscalYear === fy).forEach(po => {
      const rem = money2_(num_(po.amount) - num_(po.liquidated)); if (rem <= 0) return;
      const l = budgetLine_(pv.nextYear, po.department, po.fund, po.account, true); l.appropriation = money2_(num_(l.appropriation) + rem); l.notes = 'Includes carryforward'; update_('Budget', l);
      insert_('BudgetAmendments', { id: uuid_(), number: nextNumber_('BA'), type: 'Supplemental appropriation', fiscalYear: pv.nextYear, toDepartment: po.department, toFund: po.fund, toAccount: po.account, amount: rem,
        authority: 'Year-end encumbrance carryforward', reason: 'Open encumbrance ' + po.number + ' rolled forward from ' + fy, status: 'Approved', approvedBy: u.email, createdBy: u.email, createdAt: now_(), updatedBy: u.email, updatedAt: now_() });
      po.fiscalYear = pv.nextYear; po.updatedBy = u.email; po.updatedAt = now_(); update_('PurchaseOrders', po); rolled += rem;
    });
  }
  const types = {}; readAll_('Accounts').forEach(a => { types[a.code] = a.type; });
  const bal = {}; readAll_('Journal').forEach(l => { if (fiscalYear_(l.date) !== fy || l.source === 'Year-end close') return; const t = types[l.account]; if (t !== 'Revenue' && t !== 'Expense') return;
    const k = l.fund + '|' + l.account + '|' + l.department; bal[k] = money2_((bal[k] || 0) + l.debit - l.credit); });
  const byFund = {}; Object.keys(bal).forEach(k => { if (Math.abs(bal[k]) < 0.005) return; const s = k.split('|'); (byFund[s[0]] = byFund[s[0]] || []).push({ account: s[1], department: s[2], bal: bal[k] }); });
  const jes = [];
  Object.keys(byFund).forEach(f => {
    const lines = byFund[f].map(x => x.bal > 0 ? { account: x.account, fund: f, department: x.department, credit: x.bal } : { account: x.account, fund: f, department: x.department, debit: -x.bal });
    const net = money2_(byFund[f].reduce((s, x) => s + x.bal, 0)); // debit-positive: expenses minus revenues
    if (net > 0) lines.push({ account: A.FB, fund: f, debit: net }); else if (net < 0) lines.push({ account: A.FB, fund: f, credit: -net });
    jes.push(post_({ date: pv.end, memo: 'Year-end closing entry ' + fy + ' – fund ' + f, source: 'Year-end close', sourceRef: fy, lines: lines, allowClosed: true }, u));
  });
  setSetting_('fyClosed.' + fy, today_());
  audit_(u, 'Closed fiscal year', 'Fiscal year', fy, jes.length + ' closing entries; ' + money_(rolled) + ' of encumbrances rolled to ' + pv.nextYear);
  return { message: fy + ' closed. ' + jes.length + ' closing entr' + (jes.length === 1 ? 'y' : 'ies') + ' posted (' + jes.join(', ') + '). ' + money_(rolled) + ' of open encumbrances rolled forward to ' + pv.nextYear + '.' };
}

function apaReport_(p) {

  const rev = {}, exp = {}, funds = {};
  readAll_('Journal').forEach(l => { if (fiscalYear_(l.date) !== fy || l.source === 'Year-end close') return; funds[l.fund] = 1;
    if (types[l.account] === 'Revenue') { const k = l.fund + '|' + l.account; rev[k] = money2_((rev[k] || 0) + l.credit - l.debit); }
    if (types[l.account] === 'Expense') { const k = l.fund + '|' + (func[l.department] || 'Nondepartmental'); exp[k] = money2_((exp[k] || 0) + l.debit - l.credit); } });

.lp-roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.lp-role h3{margin:0;font-size:16px}.lp-role .who{font-size:12px;color:var(--muted)}.lp-role ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:#33445e;flex:1}

.lp-mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lp-mod{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:8px}.lp-mod h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}.lp-mod h3 span{width:32px;height:32px;border-radius:9px;background:#0d3238;color:#e0b44c;display:inline-grid;place-items:center;font-size:15px}

.lp-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lp-box{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff}.lp-box h3{margin:0 0 12px;font-size:17px}
.lp-box ul{margin:0;padding:0;list-style:none}.lp-box li{padding:7px 0 7px 26px;position:relative;font-size:14px;line-height:1.5;border-bottom:1px solid var(--line2)}.lp-box li:last-child{border:0}
.lp-box li:before{content:'✓';position:absolute;left:0;top:7px;color:var(--green);font-weight:800}.lp-box.road li:before{content:'→';color:var(--amber)}
.lp-chips{display:flex;flex-wrap:wrap;gap:8px}.lp-chips span{border:1px solid #cfdcd9;background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#0c5a56}
.lp-contact{background:linear-gradient(165deg,#0d3238,#0b3a3f);border-top:4px solid #e0b44c;color:#fff;padding:44px 28px}.lp-contact .lp-in{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.lp-contact h2{margin:0 0 6px;font-size:26px}.lp-contact p{margin:0;color:#b5d3ce}
.lp-cities{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 22px}
.lp-city{border:1px solid #cfdcd9;border-radius:12px;background:#fff;padding:14px;text-align:left;display:flex;flex-direction:column;gap:5px;cursor:pointer;font:inherit;color:inherit}
.lp-city:hover{border-color:#0f7470}.lp-city.on{border:2px solid #0f7470;box-shadow:0 6px 20px #0f747022;padding:13px}.lp-city b{font-size:15px}.lp-city .rg{font-size:11.5px;font-weight:700;color:#0f7470;text-transform:uppercase;letter-spacing:.4px}
.lp-city span{font-size:12.5px;color:var(--muted);line-height:1.45}.lp-city i{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#f6edd6;color:#7a5a12;align-self:flex-start}
.lp-plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.lp-plan{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;display:flex;flex-direction:column;gap:10px;position:relative}
.lp-plan.hi{border:2px solid #0f7470;box-shadow:0 10px 30px #0f74701c}.lp-plan .tag{position:absolute;top:-11px;left:20px;background:#e0b44c;color:#0d3238;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}
.lp-plan h3{margin:0;font-size:18px}.lp-plan .pr{font-size:36px;font-weight:800;letter-spacing:-1px;color:#0d3238}.lp-plan .pr small{font-size:14px;color:var(--muted);font-weight:600}
.lp-plan ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;flex:1}.lp-plan p{margin:0;font-size:13px;color:var(--muted)}
.lp-foot{text-align:center;font-size:12px;color:var(--muted);padding:22px}
.lp-note{font-size:12px;color:var(--muted);margin-top:14px}
#demopill{position:fixed;left:12px;bottom:12px;z-index:70;background:#fff;border:1px solid #cfdcd9;border-radius:999px;box-shadow:0 8px 30px #0d323833;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;font:12px system-ui;color:#18292e}
#demopill b{color:#0f7470}#demopill button{border:0;border-radius:999px;padding:5px 11px;background:#e3f1ef;color:#0c5a56;font-weight:650;font-size:12px}#demopill button.r{background:#fbe9e6;color:#b23a2f}

 requisitions:'Draft → Submit → Department approval → Finance approval above the threshold → Create purchase order (encumbers the budget). Approvers cannot approve their own requests.',

function visible(){
  const e=B.entities[S.view],q=S.q.trim().toLowerCase();
  let rows=S.rows.filter(r=>!S.filter||r.status===S.filter);
  if(q)rows=rows.filter(r=>Object.keys(r).some(k=>{const f=e.fields.find(x=>x.k===k);const v=f&&(f.type==='ref'||f.type==='lookup')?labelFor(f.src||f.ref,r[k]):r[k];return String(v??'').toLowerCase().includes(q)}));
  if(S.sort.col){const f=fieldOf(S.view,S.sort.col),k=S.sort.col;rows=rows.slice().sort((a,b)=>{const x=a[k],y=b[k];const c=['money','pct'].includes(f.type)?num(x)-num(y):String(f.type==='ref'?labelFor(f.ref,x):x??'').localeCompare(String(f.type==='ref'?labelFor(f.ref,y):y??''),undefined,{numeric:true});return c*S.sort.dir})}

function refreshRows(){const tb=$('#tbody');if(!tb)return;const e=B.entities[S.view],rows=visible();

  $('#rowCount').textContent=rows.length===S.rows.length?`${rows.length} record${rows.length===1?'':'s'}`:`${rows.length} of ${S.rows.length}`;}
function sortBy(k){S.sort=S.sort.col===k?{col:k,dir:-S.sort.dir}:{col:k,dir:1};const keep=$('#q')?.value;render()}
async function reloadList(){if(B.entities[S.view]){S.rows=await api('list',{entity:S.view});refreshRows()}else render()}

function showRecord(ent,id){

   ${DOCS[ent]?`<button class="btn secondary sm" onclick="${h(()=>printDocument(DOCS[ent],r.id))}">Print document</button>`:''}${canEdit?`<button class="btn secondary sm" onclick="${h(()=>editRecord(ent,r))}">Edit</button>`:''}${B.perms.finance||(ent==='users'&&B.perms.admin)?`<button class="btn danger sm" onclick="${h(()=>removeRecord(ent,r))}">Delete</button>`:''}<button class="btn secondary sm" onclick="closeModal()">Close</button></div>`,'wide');

function editRecord(ent,r,prefill){

async function removeRecord(ent,r){const e=B.entities[ent];if(!(await ask(`Delete ${e.label.toLowerCase()} ${r[e.key]}? This cannot be undone.`,{ok:'Delete',danger:true})))return;

function jeTot(){const f={};let d=0,c=0;JE.forEach(l=>{d+=num(l.debit);c+=num(l.credit);f[l.fund]=(f[l.fund]||0)+num(l.debit)-num(l.credit)});const off=Object.entries(f).filter(([k,v])=>Math.abs(v)>0.005);const ok=d>0&&!off.length;
  $('#jt').innerHTML=`Debits <b>${money(d)}</b> · Credits <b>${money(c)}</b> ${ok?'<span class="st good">Balanced</span>':d||c?`<span class="st bad">${off.length?'Out of balance in fund '+off.map(([k,v])=>esc(k)+' ('+money(v)+')').join(', '):'Out of balance'}</span>`:''}`;$('#jsave').disabled=!ok}

VIEWS.receipts=async()=>{const rows=await api('receipts');S.data=rows;const t=rows.reduce((s,r)=>s+num(r.amount),0);
  return `<div class="toolbar"><span class="muted small">${rows.length} receipts · ${money(t)}</span><button class="btn secondary right" onclick="${h(()=>exportRows('cash-receipts',['number','date','source','sourceRef','payer','fund','amount','method','reference','entryId','createdBy'],rows))}">Export CSV</button></div>
  <section class="panel flush"><div class="tablewrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Source</th><th>Payer</th><th>Fund</th><th>Method</th><th>Reference</th><th class="num">Amount</th><th>Journal</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.number)}</b></td><td class="nowrap">${esc(r.date)}</td><td>${esc(r.source)} ${esc(r.sourceRef)}</td><td>${esc(r.payer)}</td><td>${esc(r.fund)}</td><td>${esc(r.method)}</td><td>${esc(r.reference)}</td><td class="num">${money(r.amount)}</td><td>${esc(r.entryId)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No receipts yet. Payments recorded in Receivables, Utility Billing or Permits appear here.</td></tr>'}</tbody></table></div></section>`};

/* ================= Reports ================= */
const RPTS=[['trialBalance','Trial balance','Financial'],['balanceSheet','Balance sheet','Financial'],['incomeStatement','Revenues & expenditures','Financial'],['budgetVsActual','Budget vs. actual','Financial'],['apAging','AP aging','Financial'],['arAging','AR aging','Financial'],['glDetail','Account detail','Financial']];
const RENDER_RPT={};
VIEWS.reports=async()=>{
  const name=S.tab||'trialBalance',p=S.param;S.tab=name;
  const fundSel=`<select class="field" aria-label="Fund" onchange="S.param.fund=this.value;render()"><option value="">All funds</option>${L().funds.map(f=>`<option value="${esc(f.v)}" ${p.fund===f.v?'selected':''}>${esc(f.l)}</option>`).join('')}</select>`;
  const fySel=()=>{const y=+B.fiscalYear.slice(2);return `<select class="field" aria-label="Fiscal year" onchange="S.param.fiscalYear=this.value;render()">${[y+1,y,y-1,y-2].map(v=>`<option ${(p.fiscalYear||B.fiscalYear)==='FY'+v?'selected':''}>FY${v}</option>`).join('')}</select>`};
  const asOf=`<label class="small muted">As of <input class="field" type="date" value="${esc(p.asOf||B.today)}" onchange="S.param.asOf=this.value;render()"></label>`;
  let params='',body='',csv=null;
  const params0={fund:p.fund||'',asOf:p.asOf||B.today,fiscalYear:p.fiscalYear||B.fiscalYear,account:p.account||'',from:p.from||'',to:p.to||'',year:p.year||B.today.slice(0,4),quarter:p.quarter||String(Math.ceil(+B.today.slice(5,7)/3))};
  const d=(name==='glDetail'&&!params0.account)?null:await api('report',{name,params:params0});
  const sec=(title,rows,total)=>`<tr class="sub"><td colspan="2"><b>${title}</b></td></tr>${rows.map(r=>`<tr><td>${esc(r.account)} ${esc(r.name)}</td><td class="num">${money(r.amount)}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">None</td></tr>'}<tr><td><b>Total ${title.toLowerCase()}</b></td><td class="num"><b>${money(total)}</b></td></tr>`;
  if(name==='trialBalance'){params=asOf+fundSel;csv=[['Account','Name','Type','Debits','Credits','Balance'],...d.rows.map(r=>[r.account,r.name,r.type,r.debit,r.credit,r.balance])];
    body=`<div class="notice ${d.balanced?'good':'bad'}">${d.balanced?'The trial balance is in balance.':'The trial balance is out of balance — contact your administrator.'}</div><table><thead><tr><th>Account</th><th>Type</th><th class="num">Debits</th><th class="num">Credits</th><th class="num">Balance</th></tr></thead><tbody>${d.rows.map(r=>`<tr class="click" onclick="${h(()=>{S.tab='glDetail';S.param={account:r.account,fund:p.fund||''};render()})}"><td>${esc(r.account)} ${esc(r.name)}</td><td>${esc(r.type)}</td><td class="num">${money(r.debit)}</td><td class="num">${money(r.credit)}</td><td class="num">${r.balance>=0?money(r.balance)+' Dr':money(-r.balance)+' Cr'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No postings.</td></tr>'}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${money(d.totalDebit)}</td><td class="num">${money(d.totalCredit)}</td><td></td></tr></tfoot></table>`}
  if(name==='balanceSheet'){params=asOf+fundSel;csv=[['Section','Account','Name','Amount'],...d.assets.map(r=>['Assets',r.account,r.name,r.amount]),...d.liabilities.map(r=>['Liabilities',r.account,r.name,r.amount]),...d.equity.map(r=>['Fund balance',r.account,r.name,r.amount]),['Fund balance','','Current-year net change',d.netChange]];
    body=`<table><tbody>${sec('Assets',d.assets,d.totalAssets)}${sec('Liabilities',d.liabilities,d.totalLiabilities)}<tr class="sub"><td colspan="2"><b>Fund balance</b></td></tr>${d.equity.map(r=>`<tr><td>${esc(r.account)} ${esc(r.name)}</td><td class="num">${money(r.amount)}</td></tr>`).join('')}<tr><td>Current-year net change (revenues − expenses)</td><td class="num">${money(d.netChange)}</td></tr><tr><td><b>Total fund balance</b></td><td class="num"><b>${money(d.totalEquity)}</b></td></tr><tr class="sub"><td><b>Liabilities + fund balance</b></td><td class="num"><b>${money(d.totalLiabilities+d.totalEquity)}</b></td></tr></tbody></table>`}
  if(name==='incomeStatement'){params=fySel()+fundSel;csv=[['Section','Account','Name','Amount'],...d.revenues.map(r=>['Revenue',r.account,r.name,r.amount]),...d.expenses.map(r=>['Expense',r.account,r.name,r.amount]),['Net','','Revenues over (under) expenses',d.net]];
    body=`<table><tbody>${sec('Revenues',d.revenues,d.totalRevenue)}${sec('Expenditures',d.expenses,d.totalExpense)}<tr class="sub"><td><b>Revenues over (under) expenditures</b></td><td class="num"><b>${money(d.net)}</b></td></tr></tbody></table>`}
  if(name==='budgetVsActual'){params=fySel();const t=k=>d.rows.reduce((s,r)=>s+num(r[k]),0);csv=[['Department','Fund','Account','Appropriation','Encumbered','Actual','Available','Budgeted'],...d.rows.map(r=>[r.department,r.fund,r.account,r.appropriation,r.encumbered,r.actual,r.available,r.budgeted?'Yes':'No'])];
    body=`${d.rows.some(r=>!r.budgeted)?'<div class="notice warn">Some spending has no budget line (marked “unbudgeted”).</div>':''}<table><thead><tr><th>Department</th><th>Fund</th><th>Account</th><th class="num">Appropriation</th><th class="num">Encumbered</th><th class="num">Actual</th><th class="num">Available</th><th>% Used</th></tr></thead><tbody>${d.rows.map(r=>{const u=r.appropriation?(r.encumbered+r.actual)/r.appropriation*100:100;return `<tr><td>${esc(r.department)}${r.budgeted?'':'<span class="tag">unbudgeted</span>'}</td><td>${esc(r.fund)}</td><td>${esc(labelFor('accounts',r.account))}</td><td class="num">${money(r.appropriation)}</td><td class="num">${money(r.encumbered)}</td><td class="num">${money(r.actual)}</td>${fmtCell({type:'money'},r.available)}${fmtCell({type:'pct'},u)}</tr>`}).join('')||'<tr><td colspan="8" class="empty">No budget for this year.</td></tr>'}</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">${money(t('appropriation'))}</td><td class="num">${money(t('encumbered'))}</td><td class="num">${money(t('actual'))}</td><td class="num">${money(t('available'))}</td><td></td></tr></tfoot></table>`}
  if(name==='apAging'||name==='arAging'){params=asOf;const b=d.buckets;csv=[['Reference',name==='apAging'?'Vendor':'Customer','Due','Days late','Amount','Status'],...d.rows.map(r=>[r.ref,r.party,r.dueDate,r.daysLate,r.amount,r.status])];
    body=`<div class="cards">${[['Current',b.current],['1–30 days',b.d30],['31–60 days',b.d60],['61–90 days',b.d90]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num">${money(x[1])}</div></div>`).join('')}</div>${b.over90?`<div class="notice warn">Over 90 days: <b>${money(b.over90)}</b></div>`:''}<table><thead><tr><th>Reference</th><th>${name==='apAging'?'Vendor':'Customer'}</th><th>Due</th><th class="num">Days late</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${esc(r.ref)}</td><td>${esc(r.party)}</td><td>${esc(r.dueDate)}</td><td class="num">${r.daysLate||''}</td><td class="num">${money(r.amount)}</td><td>${badge(r.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nothing outstanding.</td></tr>'}</tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${money(d.total)}</td><td></td></tr></tfoot></table>`}
  if(name==='glDetail'){params=`<select class="field" aria-label="Account" onchange="S.param.account=this.value;render()"><option value="">Choose account…</option>${L().accounts.map(a=>`<option value="${esc(a.v)}" ${p.account===a.v?'selected':''}>${esc(a.l)}</option>`).join('')}</select>${fundSel}<input class="field" type="date" aria-label="From" value="${esc(p.from||'')}" onchange="S.param.from=this.value;render()"><input class="field" type="date" aria-label="To" value="${esc(p.to||'')}" onchange="S.param.to=this.value;render()">`;
    if(!d)body='<div class="empty">Choose an account to see its activity.</div>';else{csv=[['Date','Entry','Fund','Department','Memo','Debit','Credit','Balance'],...d.rows.map(r=>[r.date,r.entryId,r.fund,r.department,r.memo,r.debit,r.credit,r.balance])];
    body=`<table><thead><tr><th>Date</th><th>Entry</th><th>Fund</th><th>Department</th><th>Memo</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td class="nowrap">${esc(r.date)}</td><td>${esc(r.entryId)}</td><td>${esc(r.fund)}</td><td>${esc(r.department)}</td><td class="desc" title="${esc(r.memo)}">${esc(r.memo)}</td><td class="num">${r.debit?money(r.debit):''}</td><td class="num">${r.credit?money(r.credit):''}</td><td class="num">${money(r.balance)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No activity in this range.</td></tr>'}</tbody><tfoot><tr><td colspan="7">Ending balance</td><td class="num">${money(d.ending)}</td></tr></tfoot></table>`}}
  if(!body&&RENDER_RPT[name]){const x=RENDER_RPT[name](d,p);params=x.params||'';body=x.body;csv=x.csv||null}
  S.data=csv;
  return `${reportPicker(name)}<div class="toolbar noprint">${params}<span class="right" style="display:flex;gap:8px">${csv?`<button class="btn secondary" onclick="${h(()=>openExport(name+'.csv',toCSV(S.data)))}">Export CSV</button>`:''}<button class="btn secondary" onclick="window.print()">Print</button></span></div><section class="panel"><div class="phead"><h3>${esc(B.settings.orgName)} — ${RPTS.find(r=>r[0]===name)[1]}</h3><span class="muted small">${p.fund?'Fund '+esc(p.fund):'All funds'} · generated ${esc(B.today)}</span></div><div class="tablewrap">${body}</div></section>`;
};

/* ================= Periods, audit, settings ================= */
VIEWS.periods=async()=>{const rows=await api('periods');
  return `<div class="notice">Closing a month stops anyone from posting entries dated in it. Finance can close; only an Administrator can reopen.</div><section class="panel flush"><div class="tablewrap"><table><thead><tr><th>Period</th><th class="num">Journal lines</th><th>Status</th><th>Changed by</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.period)}</b></td><td class="num">${r.lines}</td><td>${badge(r.status==='Closed'?'Closed':'Open')}</td><td class="small muted">${esc(r.closedBy)} ${esc(r.closedAt)}</td><td style="text-align:right">${r.status==='Closed'?(B.perms.admin?`<button class="btn secondary sm" onclick="${h(()=>periodAct(r.period,'reopen'))}">Reopen</button>`:''):(B.perms.finance?`<button class="btn sm" onclick="${h(()=>periodAct(r.period,'close'))}">Close period</button>`:'')}</td></tr>`).join('')}</tbody></table></div></section>`};
async function periodAct(period,action){if(!(await ask(`${action==='close'?'Close':'Reopen'} accounting period ${period}?`,{ok:action==='close'?'Close period':'Reopen'})))return;try{const r=await api('periodAction',{period,action});toast(r.message,'ok');render()}catch(e){fail(e)}}
VIEWS.audit=async()=>{const rows=await api('audit',{limit:2000});S.data=rows;AFTER.audit=()=>{const inp=$('#aq');if(inp)inp.oninput=()=>{const q=inp.value.toLowerCase();document.querySelectorAll('#atb tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}};
  return `<div class="toolbar"><input class="field search" id="aq" type="search" placeholder="Filter by user, action, reference…"><span class="muted small">${rows.length} most recent entries</span><button class="btn secondary right" onclick="${h(()=>exportRows('audit-trail',['ts','user','role','action','entity','ref','detail'],S.data))}">Export CSV</button></div><section class="panel flush"><div class="tablewrap"><table><thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th><th>Record</th><th>Detail</th></tr></thead><tbody id="atb">${rows.map(a=>`<tr><td class="nowrap small">${esc(a.ts)}</td><td class="small">${esc(a.user)}</td><td class="small">${esc(a.role)}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.entity)} ${esc(a.ref)}</td><td class="small muted" style="max-width:420px">${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div></section>`};
VIEWS.users=()=>entityView('users');
/* ================= Export ================= */
const toCSV=rows=>rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
function exportEntity(ent){const e=B.entities[ent],cols=e.fields.map(f=>f.k);exportRows(ent,cols,visible(),k=>{const f=e.fields.find(x=>x.k===k);return f?f.label:k},(k,v)=>{const f=e.fields.find(x=>x.k===k);return f&&(f.type==='ref')?labelFor(f.ref,v):v})}
function exportRows(name,cols,rows,lab,mapv){openExport(name+'.csv',toCSV([cols.map(k=>lab?lab(k):k),...rows.map(r=>cols.map(k=>mapv?mapv(k,r[k]):r[k]))]))}
function openExport(filename,content){showModal(`<h2 id="mTitle">Export ${esc(filename)}</h2><p class="muted small">If the download doesn't start, use Copy and paste into Excel.</p><textarea class="exportbox" readonly id="xt">${esc(content)}</textarea><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Close</button><button type="button" class="btn secondary" onclick="${h(async()=>{try{await navigator.clipboard.writeText(content);toast('Copied.','ok')}catch(e){const t=$('#xt');t.select();toast(document.execCommand('copy')?'Copied.':'Press Ctrl+C to copy.')}})}">Copy</button><button type="button" class="btn" onclick="${h(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()})}">Download</button></div>`,'wide')}

/* ================= Platform console ================= */
VIEWS.platform=async()=>{const rows=await api('platformTenants');
  return `<div class="notice">Each organization (city) gets its own database and its own sign-in link. Its first administrator receives an invitation email and then adds their own staff.</div>
  <div class="toolbar"><button class="btn" onclick="${h(newTenant)}">+ New organization</button><button class="btn secondary" onclick="${h(async()=>{try{const r=await api('platformBackup');toast(r.message,'ok')}catch(e){fail(e)}})}">Back up all now</button><span class="muted small right">${rows.length} organization${rows.length===1?'':'s'}</span></div>
  <section class="panel flush"><div class="tablewrap"><table><thead><tr><th>Organization</th><th>Code</th><th>Status</th><th>Created</th><th>Sign-in link</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.slug)}</td><td>${badge(r.status)}</td><td class="small muted">${esc(r.createdAt)}<br>${esc(r.createdBy)}</td><td class="small"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></td><td style="text-align:right;white-space:nowrap">${r.status==='Active'?`<button class="btn sm" onclick="${h(()=>supportSignIn(r))}">Support sign-in</button> `:''}<button class="btn secondary sm" onclick="${h(()=>adminAccess(r))}">Admin access</button> <a class="btn secondary sm" href="${esc(r.sheet)}" target="_blank" rel="noopener">Database</a> ${r.status==='Active'?`<button class="btn danger sm" onclick="${h(()=>tenantStatus(r,'Suspended'))}">Suspend</button>`:`<button class="btn ok sm" onclick="${h(()=>tenantStatus(r,'Active'))}">Reactivate</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No organizations yet. Create the first one.</td></tr>'}</tbody></table></div></section>`};
async function adminAccess(r){
  let admins=[];try{admins=await api('platformAdmins',{slug:r.slug})}catch(e){return fail(e)}
  showModal(`<form id="xf" novalidate><h2 id="mTitle">Administrator access — ${esc(r.name)}</h2>
  <div class="notice warn"><b>Verify identity first.</b> Only act on a request you have confirmed with the city through a known contact (for example, by calling the city's main number), never on an email alone. This action is recorded in the city's audit trail.</div>
  <table><thead><tr><th>Administrator</th><th>Status</th><th>Sign-in</th><th>Last sign-in</th><th></th></tr></thead><tbody>${admins.map(a=>`<tr><td>${esc(a.name)}<div class="muted small">${esc(a.email)}</div></td><td>${badge(a.status)}</td><td>${badge(a.access)}</td><td class="small muted">${esc(a.lastLogin||'—')}</td><td><button type="button" class="btn secondary sm" data-email="${esc(a.email)}" data-name="${esc(a.name)}">Use</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No administrators.</td></tr>'}</tbody></table>
  <div class="fg" style="margin-top:14px"><label>Administrator email <b class="req">*</b><input name="email" type="email"><div class="hint">An existing user is reset and made an active Admin. A new email adds a new Admin.</div></label><label>Name (for a new administrator)<input name="name"></label><label class="span2">Reason / how identity was verified <b class="req">*</b><input name="reason" placeholder="e.g. Called City Hall main line, confirmed with City Manager J. Smith"></label></div>
  <div class="form-error" id="fe"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Email new sign-in link</button></div></form>`,'wide');
  const f=$('#xf');f.querySelectorAll('[data-email]').forEach(b=>b.onclick=()=>{f.elements.email.value=b.dataset.email;f.elements.name.value=b.dataset.name;f.elements.reason.focus()});
  f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector('[type=submit]');b.disabled=true;try{const x=await api('platformAdminAccess',{slug:r.slug,email:f.elements.email.value,name:f.elements.name.value,reason:f.elements.reason.value});closeModal();toast(x.message,'ok')}catch(e){$('#fe').textContent=e.message;b.disabled=false}};
}
async function tenantStatus(r,status){if(!(await ask(status==='Suspended'?`Suspend ${r.name}? Its users are signed out and cannot sign in until reactivated. No data is deleted.`:`Reactivate ${r.name}?`,{ok:status==='Suspended'?'Suspend':'Reactivate',danger:status==='Suspended'})))return;try{const x=await api('platformSetStatus',{slug:r.slug,status});toast(x.message,'ok');render()}catch(e){fail(e)}}
function newTenant(){
  showModal(`<form id="tf" novalidate><h2 id="mTitle">New organization</h2><div class="fg"><label class="span2">Organization name <b class="req">*</b><input name="name" placeholder="City of Springfield"></label><label>Organization code <b class="req">*</b><input name="slug" placeholder="springfield"><div class="hint">Lowercase letters, numbers, dashes. Becomes the sign-in link ?t=code</div></label><label>&nbsp;<div class="hint" id="linkprev" style="margin-top:14px"></div></label><label>Administrator name <b class="req">*</b><input name="adminName"></label><label>Administrator email <b class="req">*</b><input name="adminEmail" type="email"></label><label>Subscription<select name="plan"><option value="trial">Free trial (30 days)</option><option value="essentials">Essentials</option><option value="professional">Professional</option><option value="enterprise">Enterprise</option><option value="complimentary">Complimentary (no billing)</option></select><div class="hint">Paid plans start on invoice terms; record payments under Billing.</div></label><label>Billing cycle<select name="cycle"><option value="annual">Annual</option><option value="monthly">Monthly</option></select></label><label class="span2" style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="sample" style="width:auto;margin:0"> Load sample data (demos and training only)</label><label class="span2">Sample region<select name="sampleProfile"><option value="va">Mid-Atlantic · Virginia (Petersburg)</option><option value="tx">South Central · Texas</option><option value="az">Southwest · Arizona</option><option value="wa">Pacific Northwest · Washington</option></select><div class="hint">Sets state payroll, retirement and property-tax rules, street names and map location for the sample data.</div></label></div><div class="form-error" id="fe"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Create organization</button></div></form>`);
  const f=$('#tf');let touched=false;f.elements.slug.oninput=()=>{touched=true;prev()};f.elements.name.oninput=()=>{if(!touched)f.elements.slug.value=f.elements.name.value.toLowerCase().replace(/^(city|town|village|county) of /,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,31);prev()};
  const prev=()=>{$('#linkprev').textContent=f.elements.slug.value?'Link: …/exec?t='+f.elements.slug.value:''};
  f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector('[type=submit]');b.disabled=true;
    try{const r=await api('platformCreateTenant',{name:f.elements.name.value,slug:f.elements.slug.value,adminName:f.elements.adminName.value,adminEmail:f.elements.adminEmail.value,sample:f.elements.sample.checked,sampleProfile:f.elements.sampleProfile.value,plan:f.elements.plan.value,cycle:f.elements.cycle.value});closeModal();toast(r.message,'ok');render()}catch(e){$('#fe').textContent=e.message;b.disabled=false}};
}

/* ================= Sign-in ================= */
let TOKEN=null;
const TKEY=()=>'ierp-session-'+(START.t||'');
function saveToken(t){TOKEN=t;try{t?sessionStorage.setItem(TKEY(),t):sessionStorage.removeItem(TKEY())}catch(e){}}
function loadToken(){try{return sessionStorage.getItem(TKEY())}catch(e){return null}}
function authCard(inner){$('#app').innerHTML=`<div class="center"><div class="boxmsg auth"><div class="brand2">Intelli<span>ERP</span></div>${START.name?`<div class="orgname">${esc(START.name)}</div>`:''}${inner}<div class="authfoot">IntelliERP by Intellisoft Technologies · Secure sign-in</div></div></div>`;const i=$('#app input');if(i)i.focus()}
const msgHTML=(m,cls)=>m?`<div class="notice ${cls}" role="alert" style="margin:12px 0 0">${esc(m)}</div>`:'';
async function busyForm(form,fn){const b=form.querySelector('[type=submit]');b.disabled=true;const e=form.querySelector('.form-error');if(e)e.textContent='';try{await fn()}catch(err){if(e)e.textContent=err.message;b.disabled=false}}
function showLogin(msg,info,email){
  if(!START.t){
    authCard(`<h2>Sign in</h2><p class="muted small">Enter the organization code from your invitation email, or use the sign-in link your administrator sent you.</p>${msgHTML(msg,'bad')}<form id="of" novalidate><label>Organization code<input name="t" autocomplete="organization" required></label><div class="form-error"></div><button class="btn" type="submit">Continue</button></form><p class="small muted" style="margin:16px 0 0;text-align:center">New to IntelliERP? <button class="linkbtn" style="display:inline;padding:0" onclick="showSignup()">Start a free 30-day trial</button></p>`);
    const f=$('#of');f.onsubmit=ev=>{ev.preventDefault();busyForm(f,async()=>{const r=await api('tenantInfo',{t:f.elements.t.value});START.t=r.t;START.name=r.name;showLogin()})};return;
  }
  authCard(`<h2>Sign in</h2>${msgHTML(msg,'bad')}${msgHTML(info,'good')}<form id="lf" novalidate><label>Email<input name="email" type="email" autocomplete="username" value="${esc(email||'')}" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="form-error" role="alert"></div><button class="btn" type="submit">Sign in</button></form>${START.sso?`<div class="ordiv"><span>or</span></div><button class="btn secondary msbtn" type="button" onclick="${h(ssoGo)}"><svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><path fill="#f25022" d="M1 1h9v9H1z"/><path fill="#7fba00" d="M11 1h9v9h-9z"/><path fill="#00a4ef" d="M1 11h9v9H1z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg> Sign in with Microsoft</button>`:''}<button class="linkbtn" onclick="showForgot()">Forgot your password?</button>`);
  const f=$('#lf');if(email)f.elements.password.focus();
  f.onsubmit=ev=>{ev.preventDefault();busyForm(f,async()=>{const r=await api('login',{t:START.t,email:f.elements.email.value,password:f.elements.password.value});showCode(r,f.elements.email.value)})};
}
/* Leave the app for an outside page (Microsoft sign-in, card checkout). Apps Script runs inside a frame, so navigate the top window. */
function goTo(url){if(window.__PREVIEW){if(window.__pvGo&&window.__pvGo(url))return;location.href=url;return}try{window.top.location.href=url}catch(e){window.open(url,'_blank')}}
async function ssoGo(){try{const r=await api('ssoStart',{t:START.t});goTo(r.url)}catch(e){fail(e)}}
function showCode(res,email){
  if(res.method==='totp'){authCard(`<h2>Authenticator code</h2><p class="muted small">Open your authenticator app (Microsoft Authenticator, Google Authenticator, 1Password…) and enter the 6-digit code for IntelliERP.</p><form id="cf" novalidate><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required></label><div class="form-error" role="alert"></div><button class="btn" type="submit">Verify and sign in</button></form><button class="linkbtn" onclick="${h(()=>showLogin('','',email))}">Back</button>`);
    const f=$('#cf');f.onsubmit=ev=>{ev.preventDefault();busyForm(f,async()=>{const r=await api('verify',{challenge:res.challenge,code:f.elements.code.value});saveToken(r.token);await startApp()})};return}
  authCard(`<h2>Check your email</h2><p class="muted small">We sent a 6-digit code to <b>${esc(res.sentTo)}</b>. It expires in 10 minutes.</p><form id="cf" novalidate><label>Sign-in code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required></label><div class="form-error" role="alert"></div><button class="btn" type="submit">Verify and sign in</button></form><button class="linkbtn" onclick="${h(()=>showLogin('','',email))}">Back</button>`);
  const f=$('#cf');f.onsubmit=ev=>{ev.preventDefault();busyForm(f,async()=>{const r=await api('verify',{challenge:res.challenge,code:f.elements.code.value});saveToken(r.token);await startApp()})};
}
function showForgot(){
  authCard(`<h2>Reset your password</h2><p class="muted small">Enter your email. If it belongs to an active user, we'll send a link to choose a new password.</p><form id="rf" novalidate><label>Email<input name="email" type="email" autocomplete="username" required></label><div class="form-error"></div><button class="btn" type="submit">Email me a reset link</button></form><button class="linkbtn" onclick="showLogin()">Back to sign in</button>`);
  const f=$('#rf');f.onsubmit=ev=>{ev.preventDefault();busyForm(f,async()=>{const r=await api('requestReset',{t:START.t,email:f.elements.email.value});showLogin('',r.message)})};
}
function showSetPassword(){
  authCard(`<h2>Choose your password</h2><p class="muted small">Use at least 12 characters. A short phrase you can remember works well. Don't reuse a password from another site.</p><form id="pf2" novalidate><label>New password<input name="p1" type="password" autocomplete="new-password" required></label><label>Confirm password<input name="p2" type="password" autocomplete="new-password" required></label><div class="form-error" role="alert"></div><button class="btn" type="submit">Set password</button></form>`);
  const f=$('#pf2');f.onsubmit=ev=>{ev.preventDefault();busyForm(f,async()=>{if(f.elements.p1.value!==f.elements.p2.value)throw new Error('The passwords do not match.');const r=await api('acceptInvite',{t:START.t,token:START.invite,password:f.elements.p1.value});START.invite='';showLogin('',r.message,r.email)})};
}
function signOut(){api('logout').catch(()=>{}).finally(()=>{saveToken(null);B=null;if(window.__landing)return window.__landing();showLogin('','You have signed out.')})}
async function startApp(){
  try{B=await api('bootstrap')}catch(e){if(!e.auth)authCard(`<h2>Can't open IntelliERP</h2>${msgHTML(e.message,'bad')}<div style="margin-top:14px"><button class="btn" onclick="location.reload()">Try again</button></div>`);return}
  shell();const h0=(location.hash||'').slice(1);const valid=id=>navList().some(g=>g[1].some(n=>n[0]===id&&navAllowed(n)));
  S.view=valid(h0)?h0:(B.tenant.platform?'platform':!B.perms.read?'self':'dashboard');render();
}

<script>
'use strict';
/* =====================================================================
   IntelliERP module screens, part 1: shared helpers, reports, finance,
   banking, year-end, payroll and HR.
   ===================================================================== */

/* ---------- Shared helpers ---------- */
const fld=(k,label,o={})=>Object.assign({k,label,type:'text'},o);
const NUMKEY=/^(line1|employees|bills|opened|completed|backlog|headcount|count|submitted|issued|inspections|citations|complaints|closed|open|online|positions|vacancies|separationsYTD|delinquent|runs|assets|consumption|miles|gallons|odometer|age|mpg|riskScore|correctiveWOs12mo|overduePM|agePctOfLife|fte|life|taxYear|installment|year|quarter|replacementYear|modelYear|accounts|alreadyBilled|exceptions|noReading|readings|hours|regHours|otHours|leaveHours|days|daysLate|avgDaysToComplete|avgDaysToDecision|avgDaysToClose|n|matched|units|qty|onHand)$/;
const PCTKEY=/(Pct|Rate|pct|onTime|Compliance)$/;
const MONEYKEY=/amount|total|cost|gross|net|paid|levy|billed|collected|outstanding|revenue|expense|balance|award|expended|drawn|remaining|budget|value|fees|wages|tax|box\d|^line\d|nbv|accumulated|variance|annualized|employer|deductions|overtime|^fit$|^ss$|medicare|^state$|retirement|appropriation|encumbered|actual|available|spent|committed|match|relief|penalty|interest|lateFee|water|sewer|storm|refuse|charge|price|receipts|disbursements|liquidated|rollForward|finesIssued|feesCollected|fund balance/i;
const human=k=>String(k).replace(/([a-z])([A-Z0-9])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
function fmtAuto(k,v){if(v===null||v===undefined||v==='')return '';if(typeof v==='boolean')return v?'Yes':'No';if(typeof v!=='number')return esc(v);if(NUMKEY.test(k))return v.toLocaleString('en-US',{maximumFractionDigits:2});if(PCTKEY.test(k))return v.toFixed(1)+'%';if(MONEYKEY.test(k))return money(v);return v.toLocaleString('en-US',{maximumFractionDigits:2})}
/* Generic table: cols = [[key|fn, label, type]], type: money|num|pct|badge|html|date|text */
function T(cols,rows,o={}){
  const th=cols.map(c=>`<th class="${['money','num','pct'].includes(c[2])?'num':''}">${esc(c[1])}</th>`).join('');
  const cell=(c,r)=>{const v=typeof c[0]==='function'?c[0](r):r[c[0]],t=c[2];
    if(t==='money')return `<td class="num${num(v)<-0.004?' neg':''}">${v===''||v==null?'':money(v)}</td>`;
    if(t==='num')return `<td class="num">${v===''||v==null?'':num(v).toLocaleString('en-US',{maximumFractionDigits:2})}</td>`;
    if(t==='pct')return `<td class="num">${v===''||v==null?'':num(v).toFixed(1)+'%'}</td>`;
    if(t==='badge')return `<td>${v?badge(v):''}</td>`;if(t==='html')return `<td>${v??''}</td>`;if(t==='date')return `<td class="nowrap">${esc(v)}</td>`;
    return `<td>${esc(v)}</td>`};
  const body=rows.length?rows.map(r=>`<tr ${o.click?`class="click" tabindex="0" onclick="${h(()=>o.click(r))}"`:''} ${o.rowAttr?o.rowAttr(r):''}>${cols.map(c=>cell(c,r)).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">${esc(o.empty||'Nothing to show.')}</td></tr>`;
  return `<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${o.foot?`<tfoot><tr>${o.foot}</tr></tfoot>`:''}</table></div>`;
}
/* Auto table for report rows of unknown shape */
function autoTable(rows,o={}){if(!rows||!rows.length)return '<div class="empty">No data.</div>';const keys=Object.keys(rows[0]).filter(k=>!['id','_row'].includes(k)&&(typeof rows[0][k]!=='object'||rows[0][k]===null));
  const t=k=>typeof rows.find(r=>r[k]!==''&&r[k]!=null)?.[k]==='number'?(NUMKEY.test(k)?'num':PCTKEY.test(k)?'pct':MONEYKEY.test(k)?'money':'num'):k==='status'?'badge':'text';
  const cols=keys.map(k=>[k,human(k),t(k)]);const sums=o.totals?cols.map(c=>c[2]==='money'?`<td class="num">${money(rows.reduce((s,r)=>s+num(r[c[0]]),0))}</td>`:'<td></td>'):null;if(sums)sums[0]='<td>Total</td>';
  return T(cols,rows,{click:o.click,foot:sums?sums.join(''):''})}
const kvTable=obj=>`<table><tbody>${Object.entries(obj).map(([k,v])=>`<tr><td>${esc(human(k))}</td><td class="num">${typeof v==='object'?esc(JSON.stringify(v)):fmtAuto(k,v)}</td></tr>`).join('')}</tbody></table>`;
const statCards=list=>`<div class="cards">${list.map(([l,v,sub,cls])=>`<div class="card"><div class="label">${esc(l)}</div><div class="num ${cls||''}">${v}</div>${sub?`<div class="muted small">${sub}</div>`:''}</div>`).join('')}</div>`;
const tabsHTML=(list,cur)=>`<div class="tabs" role="tablist">${list.map(([k,l])=>`<button role="tab" class="${k===cur?'on':''}" aria-selected="${k===cur}" onclick="S.tab='${k}';render()">${esc(l)}</button>`).join('')}</div>`;
const panel=(title,body,right='')=>`<section class="panel"><div class="phead"><h3>${esc(title)}</h3>${right}</div>${body}</section>`;
const btn=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${h(fn)}">${esc(label)}</button>`;
/* Form dialog built from field definitions */
function formDialog(title,fields,label,fn,o={}){
  showModal(`<form id="gf" novalidate><h2 id="mTitle">${esc(title)}</h2>${o.intro||''}<div class="fg">${fields.map(f=>fieldHTML(f,o.vals&&o.vals[f.k]!==undefined?o.vals[f.k]:defVal(f.def,{}))).join('')}</div>${o.after||''}<div class="form-error" id="fe" role="alert"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn ${o.danger?'dangerSolid':''}" type="submit">${esc(label)}</button></div></form>`,o.size||'');
  const form=$('#gf');wireShowIf(form);if(o.onOpen)o.onOpen(form);
  form.onsubmit=async ev=>{ev.preventDefault();const p=readForm(form,fields);const miss=fields.filter(f=>f.req&&!p[f.k]);if(miss.length){$('#fe').textContent=miss.map(f=>f.label+' is required.').join(' ');return}
    const b=form.querySelector('[type=submit]');b.disabled=true;try{await fn(p,form)}catch(e){$('#fe').textContent=e.message;b.disabled=false}};
}
/* CSV */
function parseCSV(text){const rows=[];let row=[],cur='',q=false;text=String(text||'').replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}const data=rows.filter(r=>r.some(x=>String(x).trim()!==''));if(!data.length)return [];
  const head=data[0].map(x=>x.trim());return data.slice(1).map(r=>{const o={};head.forEach((k,i)=>o[k]=String(r[i]??'').trim());return o})}
const readText=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read the file.'));r.readAsText(file)});
const readB64=file=>new Promise((res,rej)=>{if(file.size>10*1024*1024)return rej(new Error('Files must be 10 MB or smaller.'));const r=new FileReader();r.onload=()=>res({name:file.name,mimeType:file.type||'application/octet-stream',base64:String(r.result).split(',')[1]||''});r.onerror=()=>rej(new Error('Could not read the file.'));r.readAsDataURL(file)});
/* CSV import dialog: paste or choose a file, then fn(rows, values) */
function csvDialog(title,help,example,fn,o={}){
  const extra=o.fields||[];
  showModal(`<form id="cv" novalidate><h2 id="mTitle">${esc(title)}</h2><p class="muted small">${help}</p>${extra.length?`<div class="fg">${extra.map(f=>fieldHTML(f,defVal(f.def,{}))).join('')}</div>`:''}
   <label class="small" style="display:block;margin-top:12px;font-weight:600;color:#4a5d63">CSV file<input type="file" accept=".csv,.txt,text/csv" id="cvfile" style="display:block;margin-top:5px"></label>
   <label class="small" style="display:block;margin-top:10px;font-weight:600;color:#4a5d63">…or paste rows (first row = column names)<textarea class="exportbox" id="cvtext" style="height:150px;margin-top:5px" placeholder="${esc(example)}"></textarea></label>
   <div class="small muted" id="cvinfo"></div><div class="form-error" id="fe" role="alert"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">${esc(o.label||'Import')}</button></div></form>`,'wide');
  const f=$('#cv');$('#cvfile').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{$('#cvtext').value=await readText(file);info()}catch(e){$('#fe').textContent=e.message}};
  const info=()=>{const rows=parseCSV($('#cvtext').value);$('#cvinfo').textContent=rows.length?rows.length+' rows · columns: '+Object.keys(rows[0]).join(', '):''};$('#cvtext').oninput=info;
  f.onsubmit=async ev=>{ev.preventDefault();const rows=parseCSV($('#cvtext').value);if(!rows.length){$('#fe').textContent='Paste or choose a CSV with a header row and at least one data row.';return}
    const vals=readForm(f,extra);const miss=extra.filter(x=>x.req&&!vals[x.k]);if(miss.length){$('#fe').textContent=miss.map(x=>x.label+' is required.').join(' ');return}
    const b=f.querySelector('[type=submit]');b.disabled=true;try{await fn(rows,vals)}catch(e){$('#fe').textContent=e.message;b.disabled=false}};
}
function download(filename,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime||'text/plain'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
function fileResult(r){showModal(`<h2 id="mTitle">${esc(r.filename)}</h2><p class="muted small">${r.count!==undefined?esc(r.count)+' records':''}${r.total!==undefined?' · '+money(r.total):''}. Download the file and upload it to your bank's portal.</p><textarea class="exportbox" readonly>${esc(r.content)}</textarea><div class="actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn" onclick="${h(()=>download(r.filename,r.content))}">Download</button></div>`,'wide')}
/* Printable document in a new window (falls back to a modal) */
function printHTML(title,html){const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:13px/1.5 Georgia,serif;color:#111;max-width:760px;margin:30px auto;padding:0 20px}h1,h2,h3{font-family:Arial,sans-serif}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccc;padding:5px 6px;text-align:left;font:12px Arial,sans-serif}td.n,th.n{text-align:right}pre{white-space:pre-wrap;font:13px/1.55 Georgia,serif}@media print{.np{display:none}}<\/style><\/head><body><p class="np"><button onclick="print()">Print / Save as PDF</button></p>${html}<\/body><\/html>`;
  const w=window.open('','_blank');if(w){w.document.open();w.document.write(doc);w.document.close();return}
  showModal(`<h2 id="mTitle">${esc(title)}</h2><div style="max-height:60vh;overflow:auto">${html}</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Close</button></div>`,'wide')}
async function printDocument(kind,id){try{const d=await api('document',{kind,id});printHTML(d.title,`<pre>${esc(d.text)}</pre>`)}catch(e){fail(e)}}

function openReport(name,param){closeModal();S.view='reports';S.q='';S.filter='';S.sort={col:null,dir:1};S.tab=name;S.param=param||{};try{history.replaceState(null,'','#reports')}catch(e){}S.toTop=true;render();toTop()}
/* ---------- Attachments on every record ---------- */
async function attachPanel(ent,r){const box=$('#attach');if(!box)return;let list=[];try{list=await api('attachList',{entity:ent,recordId:r.id})}catch(e){return}
  const draw=()=>{const b=$('#attach');if(!b)return;b.innerHTML=`<h3 style="margin:18px 0 8px;font-size:14px">Documents</h3>${list.length?`<ul class="feed">${list.map(a=>`<li><span>📎 <button class="linkbtn" style="padding:0" onclick="${h(()=>openAttach(a))}">${esc(a.name)}</button><div class="muted small">${esc(a.uploadedBy)} · ${esc(String(a.uploadedAt).slice(0,16))}${a.size?' · '+Math.round(a.size/1024)+' KB':''}</div></span>${B.perms.write?`<button class="btn danger sm" onclick="${h(async()=>{if(!(await ask('Remove '+a.name+'?',{ok:'Remove',danger:true})))return;try{await api('attachDelete',{id:a.id});list=list.filter(x=>x.id!==a.id);draw()}catch(e){fail(e)}})}">Remove</button>`:''}</li>`).join('')}</ul>`:'<div class="muted small">No documents attached.</div>'}
   ${B.perms.write?`<div class="toolbar" style="margin:8px 0 0"><label class="btn secondary sm" style="cursor:pointer">Attach file<input type="file" hidden id="atf"></label><button class="btn ghost sm" onclick="${h(()=>{const url=prompt('Link to the document (https://…)');if(!url)return;const name=prompt('Name for the link','Document')||'Document';api('attachLink',{entity:ent,recordId:r.id,url,name}).then(async()=>{list=await api('attachList',{entity:ent,recordId:r.id});draw();toast('Link attached.','ok')}).catch(fail)})}">Attach link</button></div>`:''}`;
   const inp=$('#atf');if(inp)inp.onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const d=await readB64(file);const res=await api('attachUpload',Object.assign(d,{entity:ent,recordId:r.id}));list=await api('attachList',{entity:ent,recordId:r.id});draw();toast(res.message||'Attached.','ok')}catch(e){fail(e)}}};
  draw()}
async function openAttach(a){try{const r=await api('attachGet',{id:a.id});if(r.url)window.open(r.url,'_blank','noopener');else if(r.base64){const bin=atob(r.base64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u8],{type:r.mimeType}));const x=document.createElement('a');x.href=url;x.download=r.name;document.body.appendChild(x);x.click();x.remove()}}catch(e){fail(e)}}

/* ---------- Reports: grouped picker and renderers for every module ---------- */
RPTS.push(['grantStatus','Grant status & SF-425','Procurement & grants'],['apaTransmittal','APA comparative report','Financial'],['openPOs','Open purchase orders','Procurement & grants'],['fixedAssets','Fixed asset register','Financial'],['vendor1099','1099 vendors','Procurement & grants'],
 ['payrollRegister','Payroll register (GL tie-out)','Payroll & HR'],['w2','W-2 summary','Payroll & HR'],['form941','Form 941 worksheet','Payroll & HR'],['positionBudget','Position budget','Payroll & HR'],['workforce','Workforce analytics','Payroll & HR'],
 ['utilityAnalytics','Utility billing analytics','Utilities & operations'],['cip','Capital improvement plan','Utilities & operations'],['fleet','Fleet cost & utilization','Utilities & operations'],['workOrderMetrics','Work order performance','Utilities & operations'],['assetRisk','Asset risk ranking','Utilities & operations'],
 ['permitMetrics','Permit performance','Community development'],['codeMetrics','Code enforcement','Community development'],['taxCollections','Tax collections','Revenue'],['revenueForecast','Revenue forecast','Revenue']);
function reportPicker(name){const groups=[...new Set(RPTS.map(r=>r[2]))];
  return `<div class="toolbar noprint"><label class="small muted">Report <select class="field" style="min-width:300px" onchange="S.tab=this.value;S.param={};render()">${groups.map(g=>`<optgroup label="${esc(g)}">${RPTS.filter(r=>r[2]===g).map(r=>`<option value="${r[0]}" ${r[0]===name?'selected':''}>${esc(r[1])}</option>`).join('')}</optgroup>`).join('')}</select></label></div>`}
const yearSel=p=>{const y=+B.today.slice(0,4);return `<select class="field" aria-label="Year" onchange="S.param.year=this.value;render()">${[y,y-1,y-2].map(v=>`<option ${String(p.year||y)===String(v)?'selected':''}>${v}</option>`).join('')}</select>`};
const fySel2=p=>{const y=+B.fiscalYear.slice(2);return `<select class="field" aria-label="Fiscal year" onchange="S.param.fiscalYear=this.value;render()">${[y+1,y,y-1].map(v=>`<option ${(p.fiscalYear||B.fiscalYear)==='FY'+v?'selected':''}>FY${v}</option>`).join('')}</select>`};
function genericReport(d){if(!d)return '';let out='';const scal={};

RENDER_RPT.revenueForecast=(d)=>{const all=(d.history||[]).filter(x=>x.revenue||x.expense).concat((d.forecast||[]).map(x=>Object.assign({f:1},x)));const mx=Math.max(1,...all.map(x=>Math.max(num(x.revenue||x.value||x.high),num(x.expense))));
  return {body:`<div class="notice">Linear trend of monthly revenue with an 80% confidence band. Use as a starting point for budget preparation, not a guarantee.</div><div class="trend" style="height:180px">${all.map(x=>`<div class="m" title="${esc(x.period)}: ${money(x.revenue??x.value)}"><div class="bars"><i style="height:${num(x.revenue??x.value)/mx*100}%;background:${x.f?'#9fd0c8':'#2aa36b'}"></i></div></div>`).join('')}</div><div class="legend" style="margin:8px 0 16px"><span><i style="background:#2aa36b"></i>Actual revenue</span><span><i style="background:#9fd0c8"></i>Forecast</span></div>`+genericReport(Object.assign({},d,{history:undefined})),csv:csvOf(d.forecast)}};

VIEWS.bank=async()=>{const tab=S.tab||'match';S.tab=tab;const top=tabsHTML([['match','Statement matching'],['rec','Reconciliation'],['files','Payment files'],['history','Saved reconciliations']],tab);
  if(tab==='match'){const d=await api('bankItems');const un=d.bank.filter(b=>b.status==='Unmatched'),book=d.book.filter(b=>!b.cleared);
    const tb=`<div class="toolbar">${btn('Import bank statement',bankImportDlg)}${btn('Auto-match',async()=>{try{const r=await api('bankAutoMatch');toast(r.message,'ok');render()}catch(e){fail(e)}},'secondary')}<span class="muted small right">${un.length} unmatched bank lines · ${book.length} uncleared book items</span></div>`;
    return top+tb+`<div class="panels even">${panel('Bank statement',T([['date','Date','date'],['description','Description'],['reference','Ref'],['amount','Amount','money'],['status','Status','badge']],d.bank.slice(0,300),{click:r=>bankLine(r,book)}))}${panel('Book cash activity (not yet cleared)',T([['date','Date','date'],['entryId','Entry'],['memo','Memo'],['reference','Ref'],['amount','Amount','money']],book.slice(0,300),{empty:'Everything in the books has cleared the bank.'}))}</div>`}
  if(tab==='rec'){const p=S.param;let res='';if(p.stmt!==undefined){const r=await api('bankRec',{asOf:p.asOf||B.today,statementBalance:p.stmt});S.data=r;
      res=statCards([['Bank statement balance',money(r.statementBalance)],['+ Deposits in transit',money(r.ditTotal)],['− Outstanding checks/debits',money(r.outstandingTotal)],['Adjusted bank balance',money(r.adjustedBank)]])+statCards([['Book cash balance',money(r.bookBalance)],['Difference',money(r.difference),Math.abs(r.difference)<0.005?'Reconciled':'Investigate',Math.abs(r.difference)<0.005?'':'neg'],['Unmatched bank lines',String((r.unmatchedBank||[]).length)],['',' ']])+
      `<div class="toolbar">${btn('Save reconciliation',()=>formDialog('Save reconciliation',[fld('note','Note (required if out of balance)')],'Save',async v=>{const x=await api('bankRecSave',{asOf:r.asOf,statementBalance:r.statementBalance,note:v.note});closeModal();toast(x.message,'ok')}))}${btn('Print',()=>window.print(),'secondary')}</div><div class="panels even">${panel('Outstanding checks & debits',T([['date','Date','date'],['entryId','Entry'],['memo','Memo'],['reference','Ref'],['amount','Amount','money']],r.outstanding))}${panel('Deposits in transit',T([['date','Date','date'],['entryId','Entry'],['memo','Memo'],['amount','Amount','money']],r.dit))}</div>`}
    return top+`<div class="toolbar"><label class="small muted">Statement date <input class="field" type="date" id="ra" value="${esc(p.asOf||B.today)}"></label><label class="small muted">Statement ending balance <input class="field" type="number" step="0.01" id="rs" value="${esc(p.stmt??'')}"></label>${btn('Reconcile',()=>{S.param.asOf=$('#ra').value;S.param.stmt=$('#rs').value||0;render()})}</div>`+(res||'<div class="empty">Enter the statement date and ending balance from your bank statement.</div>')}
  if(tab==='files')return top+`<div class="panels even">${panel('Positive pay',`<p class="small muted">Issued-check file for your bank's positive pay service (check number, date, amount, payee).</p><div class="toolbar"><input class="field" type="date" id="ppf" value="${addDays(B.today,-30)}"><input class="field" type="date" id="ppt" value="${B.today}">${btn('Create file',async()=>{try{fileResult(await api('positivePay',{from:$('#ppf').value,to:$('#ppt').value}))}catch(e){fail(e)}})}</div>`)}${panel('Vendor ACH (NACHA CCD)',`<p class="small muted">NACHA file of vendor invoices paid by ACH on a date. Requires bank routing, company ID and vendor ACH details (Settings → Banking).</p><div class="toolbar"><input class="field" type="date" id="achd" value="${B.today}">${btn('Create NACHA file',async()=>{try{fileResult(await api('achVendorFile',{date:$('#achd').value}))}catch(e){fail(e)}})}</div><p class="small muted">Payroll direct deposit (NACHA PPD) files are created from each processed pay run.</p>`)}</div>`;
  const rows=await api('bankRecs');return top+panel('Saved reconciliations',T([['asOf','As of','date'],['statementBalance','Statement','money'],['bookBalance','Book','money'],['outstandingChecks','Outstanding','money'],['depositsInTransit','In transit','money'],['difference','Difference','money'],['note','Note'],['savedBy','Saved by']],rows,{empty:'No reconciliations saved yet.'}));
};

function bankImportDlg(){csvDialog('Import bank statement','Columns: <b>date</b>, <b>description</b>, <b>amount</b> (negative for debits, or separate <b>debit</b>/<b>credit</b> columns), optional <b>reference</b> (check number). Duplicate lines are skipped.','date,description,amount,reference\n2026-10-01,CHECK 10421,-1250.00,10421',async rows=>{const r=await api('bankImport',{rows});closeModal();toast(r.message,'ok');render()})}
function bankLine(t,book){
  if(t.status!=='Unmatched'){showModal(`<h2 id="mTitle">Bank line ${esc(t.date)}</h2><dl class="kv"><dt>Description</dt><dd>${esc(t.description)}</dd><dt>Amount</dt><dd>${money(t.amount)}</dd><dt>Status</dt><dd>${badge(t.status)}</dd><dt>Matched to</dt><dd>${esc(t.matchedEntries)}</dd><dt>By</dt><dd>${esc(t.matchedBy)} ${esc(t.matchedAt)}</dd></dl><div class="actions"><button class="btn danger sm" onclick="${h(async()=>{try{const r=await api('bankUnmatch',{id:t.id});closeModal();toast(r.message||'Unmatched.','ok');render()}catch(e){fail(e)}})}">Unmatch</button><button class="btn secondary sm" onclick="closeModal()">Close</button></div>`);return}
  const cand=book.slice().sort((a,b)=>Math.abs(a.amount-t.amount)-Math.abs(b.amount-t.amount)).slice(0,40);
  showModal(`<form id="bm"><h2 id="mTitle">Match ${money(t.amount)} · ${esc(t.date)}</h2><p class="small muted">${esc(t.description)} ${esc(t.reference)}</p><p class="small">Tick the book entries that make up this bank line (several deposits can be combined).</p><div class="tablewrap" style="max-height:300px;overflow:auto"><table><tbody>${cand.map(c=>`<tr><td><input type="checkbox" value="${esc(c.entryId)}" data-a="${c.amount}"></td><td>${esc(c.date)}</td><td>${esc(c.entryId)}</td><td class="desc">${esc(c.memo)}</td><td>${esc(c.reference)}</td><td class="num">${money(c.amount)}</td></tr>`).join('')||'<tr><td class="empty">No uncleared book items.</td></tr>'}</tbody></table></div><div class="small" id="bmt" style="margin-top:8px"></div><div class="form-error" id="fe"></div>
   <div class="actions"><div class="left"><button type="button" class="btn secondary sm" onclick="${h(()=>bankAdjDlg(t))}">Record as bank fee / interest…</button></div><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Match</button></div></form>`,'wide');
  const f=$('#bm');const upd=()=>{const s=[...f.querySelectorAll('input:checked')].reduce((x,i)=>x+num(i.dataset.a),0);$('#bmt').innerHTML=`Selected ${money(s)} of ${money(t.amount)} ${Math.abs(s-t.amount)<0.005?'<span class="st good">Exact</span>':''}`};f.onchange=upd;upd();
  f.onsubmit=async ev=>{ev.preventDefault();const ids=[...f.querySelectorAll('input:checked')].map(i=>i.value);if(!ids.length){$('#fe').textContent='Select at least one entry.';return}try{const r=await api('bankMatch',{id:t.id,entryIds:ids});closeModal();toast(r.message,'ok');render()}catch(e){$('#fe').textContent=e.message}}}
function bankAdjDlg(t){formDialog('Record '+money(t.amount)+' from the bank statement',[fld('account','Account',{type:'lookup',src:'accounts',req:1,def:t.amount<0?'5200':'4900'}),fld('fund','Fund',{type:'lookup',src:'funds',req:1,def:'100'}),fld('department','Department',{type:'lookup',src:'departments'}),fld('memo','Memo',{req:1,def:t.description})],'Post & match',async v=>{const r=await api('bankAdjust',Object.assign({id:t.id},v));closeModal();toast(r.message,'ok');render()},{intro:'<p class="small muted">Posts a journal entry to cash for an item that appears only on the bank statement (service charges, interest, returned items) and marks the line matched.</p>'})}

async function aiCapture(){showModal(`<form id="ai"><h2 id="mTitle">Capture a vendor invoice</h2><p class="small muted">Upload the invoice PDF or image. The AI reads vendor, number, dates, amount and PO, and fills in a new invoice for you to check. Nothing is saved until you click Create.</p><input type="file" id="aif" accept="application/pdf,image/png,image/jpeg"><div class="form-error" id="fe"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Read invoice</button></div></form>`);

async function payRunView(id){
  const {run,lines}=await api('payRun',{id});const draft=run.status==='Draft'&&B.perms.payroll;
  const act=(a,label,cls)=>btn(label,async()=>{if(a==='void'&&!(await ask('Void '+run.number+'?',{ok:'Void',danger:true})))return;try{const r=await api('payRunAction',{id:run.id,action:a});toast(r.message,'ok');render()}catch(e){fail(e)}},cls);
  const btns=[];if(run.status==='Draft'&&B.perms.payroll)btns.push(act('submit','Submit for approval',''));if(run.status==='Pending Approval'&&B.perms.finance){btns.push(act('process','Approve & post','ok'));btns.push(act('reopen','Return to draft','secondary'))}if(['Draft','Pending Approval'].includes(run.status)&&B.perms.finance)btns.push(act('void','Void','danger'));
  if(run.status==='Processed'&&B.perms.finance)btns.push(btn('Direct deposit file',async()=>{try{fileResult(await api('directDepositFile',{id:run.id}))}catch(e){fail(e)}},'secondary'));
  const ed=(l,k)=>draft&&(k!=='regHours'||l.payType==='Hourly')?`<input class="cellin" style="width:70px" type="number" step="0.25" min="0" data-f="${k}" value="${num(l[k])}" aria-label="${k} for ${esc(l.employeeName)}">`:num(l[k])||'';
  const cols=['regPay','otPay','gross','preTaxBen','retirement','fit','ss','medicare','state','otherDed','net'];
  return `<div class="toolbar"><button class="btn secondary" onclick="navigate('payroll')">← All pay runs</button><span><b>${esc(run.number)}</b> · ${esc(run.periodStart)} – ${esc(run.periodEnd)} · pays ${esc(run.payDate)}</span>${badge(run.status)}<span class="right" style="display:flex;gap:8px;flex-wrap:wrap">${btns.join('')}</span></div>
  ${run.entryId?`<div class="notice good">Posted to the general ledger in ${esc(run.entryId)} by ${esc(run.approvedBy)}. Salaries are distributed by department and project; employer FICA, VRS and benefits are posted to 5100.</div>`:''}
  ${statCards([['Employees',num(run.employees)],['Gross pay',money(run.gross)],['Employee deductions',money(run.deductions)],['Net pay',money(run.net)]])}

   <h3>Earnings</h3><table><tr><th>Item</th><th class="n">Hours</th><th class="n">Rate</th><th class="n">Current</th><th class="n">Year to date</th></tr><tr><td>Regular</td><td class="n">${num(L2.regHours)}</td><td class="n">${money(L2.rate)}</td><td class="n">${money(L2.regPay)}</td><td class="n">${money(Y.regPay)}</td></tr><tr><td>Overtime</td><td class="n">${num(L2.otHours)}</td><td class="n"></td><td class="n">${money(L2.otPay)}</td><td class="n">${money(Y.otPay)}</td></tr><tr><td><b>Gross pay</b></td><td></td><td></td><td class="n"><b>${money(L2.gross)}</b></td><td class="n"><b>${money(Y.gross)}</b></td></tr></table>

<script>
'use strict';
